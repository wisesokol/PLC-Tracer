<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC Tracer Player</title>
<style>
:root{
  --bg:#0d1117;--bg2:#131c24;--bg3:#1a2535;--bg4:#202f40;
  --border:#28394a;--border2:#38536a;
  --acc:#26c0a0;--acc2:#40e0c0;
  --green:#3ddc84;--red:#e05050;--blue:#4a9eff;
  --cyan:#40d0c0;--yellow:#f0d060;--purple:#b080e0;--orange:#e07c24;
  --text:#d4e8f0;--text2:#7aaccc;--text3:#3a5a74;
  --mono:'Consolas',monospace;--sans:'Bahnschrift',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

header{background:var(--bg2);border-bottom:2px solid var(--acc);padding:0 14px;height:46px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.1em;white-space:nowrap;}
.logo em{color:var(--text3);font-style:normal;}
.spacer{flex:1;}
.hbtn{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:4px 10px;cursor:pointer;border-radius:2px;letter-spacing:.06em;transition:all .15s;white-space:nowrap;}
.hbtn:hover{border-color:var(--acc);color:var(--acc);}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#canvas-wrap{flex:1;position:relative;overflow:hidden;}
#gc{display:block;width:100%;height:100%;}

/* ── TIMELINE ── */
#timeline{background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
#tl-controls{display:flex;align-items:center;gap:8px;padding:4px 12px;height:32px;}
#tl-controls button{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:2px 10px;cursor:pointer;border-radius:2px;}
#tl-controls button:hover{border-color:var(--acc);color:var(--acc);}
#tl-controls button.active{background:#0a2018;border-color:var(--acc);color:var(--acc);}
#tl-time{font-family:var(--mono);font-size:11px;color:var(--acc2);min-width:100px;text-align:center;}
#tl-speed{font-family:var(--mono);font-size:10px;color:var(--text3);}
#tl-bar{flex:1;position:relative;margin:0 12px 6px;cursor:pointer;overflow-x:auto;overflow-y:hidden;}
#tl-bar::-webkit-scrollbar{height:6px;}
#tl-bar::-webkit-scrollbar-track{background:var(--bg3);border-radius:3px;}
#tl-bar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
#tl-bar::-webkit-scrollbar-thumb:hover{background:var(--acc);}
#tl-inner{min-width:100%;position:relative;}
#tl-track{height:20px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;position:relative;overflow:hidden;}
#tl-fill{height:100%;background:linear-gradient(90deg,#0a2018,#26c0a044);width:0%;pointer-events:none;}
#tl-cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);pointer-events:none;left:0%;}
#tl-ticks{height:14px;position:relative;}
.tl-tick{position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--text3);transform:translateX(-50%);white-space:nowrap;}
#tl-zoom-wrap{display:flex;align-items:center;gap:4px;margin-left:8px;}
#tl-zoom-wrap label{font-family:var(--mono);font-size:9px;color:var(--text3);}
#tl-zoom-track{width:60px;height:6px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;position:relative;cursor:pointer;}
#tl-zoom-thumb{position:absolute;top:-4px;width:10px;height:14px;background:var(--acc);border-radius:2px;cursor:grab;left:0%;}
#tl-zoom-thumb:hover{background:#3dffc0;}
#tl-zoom-fill{position:absolute;top:0;bottom:0;left:0;background:rgba(38,192,160,.25);border-radius:2px;}

/* ── HISTORY VARIABLES PANEL ── */
#btn-hist-vars{font-family:var(--mono);font-size:11px;font-weight:bold;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;cursor:pointer;border-radius:2px;}
#btn-hist-vars:hover{border-color:var(--acc);color:var(--acc);}
#btn-hist-vars.active{background:#0a2018;border-color:var(--acc);color:var(--acc);}
#hist-vars-wrap{position:relative;display:inline-flex;}
#hist-vars-panel{display:none;position:absolute;left:0;bottom:100%;margin-bottom:6px;width:400px;max-height:300px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:4px;z-index:60;box-shadow:0 -4px 18px rgba(0,0,0,.55);}
#hist-vars-panel.open{display:block;}
.hist-var-title{font-family:var(--mono);font-size:10px;color:var(--acc);padding:4px 6px;border-bottom:1px solid var(--border);letter-spacing:.06em;}
.hist-var-empty{font-family:var(--mono);font-size:10px;color:var(--text3);padding:8px 6px;line-height:1.5;}
.hist-var-row{padding:5px 6px;border-bottom:1px solid var(--bg3);}
.hist-var-name{font-family:var(--mono);font-size:11px;color:var(--acc2);word-break:break-all;}
.hist-var-sym{font-family:var(--sans);font-size:11px;color:var(--text);}
.hist-var-desc{font-family:var(--sans);font-size:11px;color:var(--text2);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ── TIMELINE CHANNELS ── */
.tl-chan{position:relative;height:22px;border-top:1px solid var(--border);background:var(--bg);}
.tl-chan-lbl{position:sticky;left:4px;z-index:2;height:22px;width:max-content;font-family:var(--mono);font-size:9px;color:var(--text2);display:inline-flex;align-items:center;white-space:nowrap;pointer-events:auto;cursor:context-menu;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),1px 1px 2px var(--bg);}
.tl-chan-lbl:hover{color:var(--red);}
.tl-seg{position:absolute;top:2px;bottom:2px;border-radius:1px;pointer-events:auto;}
.tl-seg-on{background:#1a4d2a;border-top:2px solid var(--green);}
.tl-seg-off{background:#4d1a1a;border-top:2px solid var(--red);}
#tl-remove-all{font-family:var(--mono);font-size:9px;color:var(--red);background:var(--bg3);border:1px solid #3a1515;padding:2px 8px;cursor:pointer;border-radius:2px;display:none;}
#tl-remove-all:hover{border-color:var(--red);color:#ff6060;}
#canvas-ctx-menu{display:none;flex-direction:column;overflow:hidden;}
.cctx-item{font-family:var(--mono);font-size:11px;color:var(--acc);padding:7px 14px;cursor:pointer;transition:background .1s;}
.cctx-item:hover{background:rgba(38,192,160,.12);}
.cctx-tag{font-family:var(--mono);font-size:9px;color:var(--text3);padding:4px 14px 6px;border-top:1px solid var(--border);}

/* ── DROP OVERLAY ── */
#drop-overlay{position:absolute;inset:0;background:rgba(7,9,11,0.92);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .2s;}
#drop-overlay.hidden{display:none;opacity:0;}
.drop-icon{font-size:48px;color:var(--acc);opacity:.6;}
.drop-text{font-family:var(--mono);font-size:14px;color:var(--text2);letter-spacing:.08em;}
.drop-hint{font-family:var(--mono);font-size:10px;color:var(--text3);}

/* ── CLOCK OVERLAY ── */
#rec-clock{position:absolute;top:8px;left:10px;z-index:9;font-family:var(--mono);font-size:14px;color:var(--acc2);background:rgba(13,17,23,.82);border:1px solid var(--border);border-radius:3px;padding:3px 10px;pointer-events:none;display:none;letter-spacing:.06em;}

/* ── TAG PANEL ── */
#tag-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;z-index:10;display:none;padding:8px;}
#tag-panel.open{display:block;}
#tag-panel .tag-row{font-family:var(--mono);font-size:10px;padding:3px 6px;display:flex;justify-content:space-between;border-bottom:1px solid var(--bg3);}
.tag-name{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tag-val{color:var(--acc2);min-width:60px;text-align:right;}
.tag-val.on{color:var(--green);}
.tag-val.off{color:var(--red);}

/* ── TOOLTIP ── */
#tt{position:fixed;background:rgba(7,9,11,.96);border:1px solid var(--border2);padding:8px 12px;border-radius:3px;pointer-events:none;display:none;z-index:100;max-width:380px;}
.tt-n{font-family:var(--mono);font-size:12px;color:var(--acc);margin-bottom:2px;}
.tt-s{font-family:var(--sans);font-size:12px;color:var(--text);margin-bottom:3px;}
.tt-t{font-family:var(--mono);font-size:10px;color:var(--text3);}
.tt-d{font-family:var(--sans);font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4;}
.tt-ops{font-family:var(--mono);font-size:11px;margin-top:5px;display:none;}
.tt-ops-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 5px;margin-bottom:3px;}
.tt-ops-lbl{color:var(--text3);font-size:10px;min-width:42px;flex-shrink:0;}
.tt-ops-addr{color:var(--text2);word-break:break-all;}
.tt-ops-val{font-weight:bold;}
.tt-ops-val.on{color:var(--green);}
.tt-ops-val.off{color:var(--red);}
.tt-ops-val.num{color:var(--blue);}
.tt-ops-val.lit{color:var(--yellow);}
.tt-v{font-family:var(--mono);font-size:12px;font-weight:bold;margin-top:4px;}
</style>
</head>
<body>

<header>
  <div class="logo">PLC TRACER <em>PLAYER</em></div>
  <div class="spacer"></div>
  <span id="rec-info" style="font-family:var(--mono);font-size:10px;color:var(--text3);"></span>
  <button class="hbtn" id="btn-tags" onclick="toggleTagPanel()">TAGS</button>
  <button class="hbtn" onclick="document.getElementById('fi').click()">OPEN</button>
  <input type="file" id="fi" accept=".ndrec" style="display:none" onchange="handleFile(this.files[0])">
</header>

<div id="tt"><div class="tt-n" id="tt-n"></div><div class="tt-s" id="tt-s"></div><div class="tt-t" id="tt-t"></div><div class="tt-d" id="tt-d"></div><div class="tt-ops" id="tt-ops"></div><div class="tt-v" id="tt-v"></div></div>
<div id="tl-tt" style="display:none;position:fixed;z-index:200;background:#0c1420;border:1px solid var(--border2);padding:4px 8px;font-family:var(--mono);font-size:10px;color:var(--text);border-radius:2px;pointer-events:none;white-space:nowrap;"></div>
<div id="canvas-ctx-menu"></div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="gc"></canvas>
    <div id="rec-clock"></div>
    <div id="tag-panel"></div>
  </div>

  <div id="drop-overlay">
    <div class="drop-icon">&#9654;</div>
    <div class="drop-text">Drop .ndrec recording file here</div>
    <div class="drop-hint">or click OPEN button</div>
  </div>

  <div id="timeline">
    <div id="tl-controls">
      <span id="hist-vars-wrap">
        <button id="btn-hist-vars" onclick="toggleHistVars()" title="History variables legend">L</button>
        <div id="hist-vars-panel"></div>
      </span>
      <button id="btn-prev" onclick="stepFrame(-1)">&#9664;&#9664;</button>
      <button id="btn-play" onclick="togglePlay()">&#9654;</button>
      <button id="btn-next" onclick="stepFrame(1)">&#9654;&#9654;</button>
      <span id="tl-time">00:00.000</span>
      <div class="spacer"></div>
      <button onclick="setSpeed(0.25)">0.25x</button>
      <button onclick="setSpeed(0.5)">0.5x</button>
      <button class="active" onclick="setSpeed(1)">1x</button>
      <button onclick="setSpeed(2)">2x</button>
      <button onclick="setSpeed(4)">4x</button>
      <span id="tl-speed">1x</span>
      <button id="tl-remove-all" onclick="tlChannels=[];renderTlChannels();">✕ Remove all</button>
      <div id="tl-zoom-wrap">
        <label>🔍</label>
        <div id="tl-zoom-track"><div id="tl-zoom-fill"></div><div id="tl-zoom-thumb"></div></div>
        <label id="tl-zoom-val">1x</label>
      </div>
    </div>
    <div id="tl-bar">
      <div id="tl-inner">
        <div id="tl-track">
          <div id="tl-fill"></div>
          <div id="tl-cursor"></div>
        </div>
        <div id="tl-ticks"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const CW = 60, CH = 68, BRANCH_GAP = 6, RUNG_GAP = 48;
const HDR_H = 22, RAIL_W = 8, COIL_ZONE = 70, WIRE_MARGIN = 28;

const OUT_I = new Set(['OTE','OTL','OTU','OTD']);
const IN_I  = new Set(['XIC','XIO','OSR','OSF','ONS']);
const MATH_DEST_I = new Set(['MOV','ADD','SUB','MUL','DIV','MOD','CLR','SQR','NEG','ABS','AND','OR','XOR','NOT','SCP','SCL','TOD','FRN']);
const BIG_I = new Set(['TON','TOF','RTO','CTU','CTD','RES','EQU','GRT','LES','GEQ','LEQ','NEQ','LIM','MEQ','MOV','ADD','SUB','MUL','DIV','MOD','CPT','CLR','SQR','NEG','ABS','AND','OR','XOR','NOT','COP','CPS','FLL','MSG','GSV','SSV','SCP','SCL','TOD','FRN','PID','IIM','IOM','DTOS','SRT','SWPB','MVM','TND','BTD','SIZE','RET','AFI']);

// ── FIFO/LIFO (FFL/FFU/LFL/LFU) ──
// Operand order: FFL/LFL = Source, Stack, Control, Length, Position
//                FFU/LFU = Stack, Dest, Control, Length, Position
// The block is lit by its own edge-memory bit in the CONTROL structure:
// .EN for the loaders, .EU for the unloaders. Kept in step with the tracer —
// test_rec_player_sweep.js compares cell state between the two.
const FIFO_I      = new Set(['FFL','FFU','LFL','LFU']);
const FIFO_LOAD_I = new Set(['FFL','LFL']);
const FIFO_BITS   = ['EN','EU','DN','EM','ER','UL','IN','FD'];
function fifoParts(inst){
  if(!inst || !FIFO_I.has(inst.t)) return null;
  const o = inst.operands || [];
  const load = FIFO_LOAD_I.has(inst.t);
  return {
    load,
    stackLbl: (inst.t==='LFL'||inst.t==='LFU') ? 'LIFO' : 'FIFO',
    src   : load ? (o[0]||'') : '',        // word read into the stack
    dst   : load ? '' : (o[1]||''),        // word written out of the stack
    stack : load ? (o[1]||'') : (o[0]||''),// stack base (file pointer, # stripped)
    ctl   : o[2] ? normalizeAddr(o[2]) : '',
    lenOp : o[3]||'',
    posOp : o[4]||'',
    enBit : load ? 'EN' : 'EU'
  };
}
function fifoCtlBit(ctl, bit){
  if(!ctl) return null;
  const lv = resolveLV(`${ctl}/${bit}`) || resolveLV(`${ctl}.${bit}`);
  return (lv && !lv.error && lv.value !== undefined && lv.value !== null) ? (lv.value ? 1 : 0) : null;
}
// Live .LEN / .POS of the CONTROL structure. RSLogix bakes both into the rung
// text as trailing literals, so those stand in whenever nothing is recorded.
function fifoCtlNum(ctl, sub, literal){
  if(ctl){
    const lv = resolveLV(`${ctl}.${sub}`) || resolveLV(`${ctl}/${sub}`);
    if(lv && !lv.error && lv.value !== undefined && lv.value !== null){
      const n = Number(lv.value);
      if(!isNaN(n)) return n;
    }
  }
  const n = parsePlcLiteral(literal);
  return n !== null ? Number(n) : null;
}
// "#N9:0" + LEN -> the concrete stack words N9:0 … N9:<LEN-1>.
function fifoStackAddrs(stack, len){
  const base = stripHash(stack||'');
  const m = base.match(/^([A-Za-z]+\d*):(\d+)$/);
  if(!m || !len || len < 1) return [];
  const n = Math.min(len, 128);          // an SLC stack tops out at 128 elements
  const first = parseInt(m[2], 10);
  const out = [];
  for(let i=0;i<n;i++) out.push(`${m[1]}:${first+i}`);
  return out;
}

const L5X_INST_MAP = {'NE':'NEQ','EQ':'EQU','GT':'GRT','GE':'GEQ','LT':'LES','LE':'LEQ','MOVE':'MOV','LIMIT':'LIM'};
const L5X_OUT_INST  = new Set(['OTE','OTL','OTU','OTD','OTDF']);
const L5X_BOTH_INST = new Set(['TON','TOF','RTO','TONR','CTU','CTD','RES','CTUD','MSG','PID','OSR','OSF','FFL','FFU','LFL','LFU','BSL','BSR','SQI','SQO','SQL','FAL','FSC','DDT','FBC']);
const L5X_MATH_DEST = new Set(['MOV','MOVE','ADD','SUB','MUL','DIV','MOD','CPT','CLR','SQR','NEG','ABS','AND','OR','XOR','NOT','COP','CPS','FLL','MVM','SWPB','CONCAT','DELETE','INSERT','MID','FIND','DTOS','STOD','RTOS','STOR','LOWER','UPPER','DEG','RAD','TRN','ACS','ASN','ATN','COS','SIN','TAN','LOG','LN','XPY','AVE','SRT','SIZE']);

const INST_COLOR={
  XIC:'#3ddc84',XIO:'#e05050',OTE:'#26c0a0',OTL:'#30d0a0',OTU:'#c05050',
  EQU:'#f0d060',GRT:'#f0d060',LES:'#f0d060',GEQ:'#f0d060',LEQ:'#f0d060',NEQ:'#f0d060',LIM:'#f0d060',
  EQ:'#f0d060',NE:'#f0d060',GT:'#f0d060',LT:'#f0d060',GE:'#f0d060',LE:'#f0d060',LIMIT:'#f0d060',MEQ:'#f0d060',
  MOV:'#b080e0',MOVE:'#b080e0',ADD:'#b080e0',SUB:'#b080e0',MUL:'#b080e0',DIV:'#b080e0',MOD:'#b080e0',
  CPT:'#b080e0',CLR:'#b080e0',MVM:'#b080e0',SQR:'#b080e0',NEG:'#b080e0',ABS:'#b080e0',
  CONCAT:'#b080e0',DTOS:'#b080e0',STOD:'#b080e0',MID:'#b080e0',INSERT:'#b080e0',DELETE:'#b080e0',FIND:'#b080e0',
  TON:'#40d0c0',TOF:'#40d0c0',RTO:'#40d0c0',TONR:'#40d0c0',
  CTU:'#4a9eff',CTD:'#4a9eff',CTUD:'#4a9eff',RES:'#4a9eff',
  OSR:'#d08040',OSF:'#d08040',ONS:'#d08040',
  JSR:'#80a0c0',JMP:'#80a0c0',LBL:'#80a0c0',RET:'#80a0c0',
  PID:'#e07c24',MSG:'#e07c24',GSV:'#e07c24',SSV:'#e07c24',
  BTD:'#b080e0',COP:'#b080e0',FLL:'#b080e0',FFL:'#6a96b0',FFU:'#6a96b0',
  SCP:'#b080e0',SCL:'#b080e0',TOD:'#b080e0',FRN:'#b080e0',
  IIM:'#d08040',IOM:'#d08040',SRT:'#b080e0',SWPB:'#b080e0',TND:'#80a0c0',SIZE:'#b080e0',
};
function iClr(t){return INST_COLOR[t]||'#6a96b0';}

const STATE_FILL  = {on:'#0f3520',off:'#281010',timing:'#281c00',numeric:'#0f1e38',null:'#131d2a'};
const STATE_BORD  = {on:'#3ddc84',off:'#c03030',timing:'#e09020',numeric:'#4a9eff',null:null};
const STATE_WIRE  = {on:'#3ddc84cc',off:'#7a1a1aaa',timing:'#c07020aa',numeric:'#2a5090aa',null:'#253e5a'};
const STATE_GLOW  = {on:'#3ddc8444',off:null,timing:'#e0902033',numeric:null,null:null};
const STATE_INNER = {on:'#3ddc8422',off:'#c0303010',timing:'#e0902020',numeric:'#4a9eff18',null:null};

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let rec = null;         // loaded recording
let tagIndex = [];      // tag name list from header
let graphData = null;   // graph snapshot from header
let liveValues = {};    // tag name → {value, ts}
let recSyms = {};       // addr → {sym, desc} from recording header (graphSnap.syms)
let P = null;           // {syms, isL5X}: the shared tooltip reads the tracer's P, here the recording's
let ladderScene = [];
let currentRungProg = null;

// Playback
let allFrames = [];     // [{ts, v|d}] — flattened from all chunks
let baseValues = [];    // full value snapshot (rebuilt from last 'v' frame)
let currentValues = []; // current state of all tags
let frameIdx = 0;
let playing = false;
let playSpeed = 1;
let playTimer = null;
let rafId = null;
let playStartWall = 0;   // performance.now() at play start
let playStartRec = 0;    // allFrames[frameIdx].ts at play start
let recStartTs = 0;
let recEndTs = 0;

// Canvas
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
let cam = {x:0, y:0, z:1};
let drag = {on:false, lx:0, ly:0, moved:false};
let hovHit = null, selHit = null;
let currentRecTs = 0;  // Visual cursor position (ms timestamp), independent of frameIdx
let tlDragging = false; // Timeline mouse drag state
let tlZoom = 1;        // Timeline zoom level (1..20)
let tlAnchorFrac = 0.5; // Where cursor sits in visible bar (0=left, 1=right)

// Timeline channels
let tlChannels = [];       // [{tagName, segs:[{t0,t1,val}]}]
const TL_MAX_CHAN = 6;
const BOOL_INST = new Set(['XIC','XIO','OTE','OTL','OTU','OTD','ONS','OSR','OSF','OTDF']);
function isBoolInst(t){ return BOOL_INST.has(t); }

function buildTagSegments(tagName){
  const idx = tagIndex.indexOf(tagName);
  if(idx === -1) return [];
  const segs = [];
  const state = new Array(tagIndex.length).fill(null);
  let curVal = null, curTs = recStartTs;
  for(const frame of allFrames){
    if(frame.v){ for(let i=0;i<frame.v.length;i++) state[i]=frame.v[i]; }
    else if(frame.d){ frame.d.forEach(([i,v])=>{ state[i]=v; }); }
    const raw = state[idx];
    const val = raw != null ? Number(raw) : 0;
    if(curVal === null){ curVal = val; curTs = frame.ts; continue; }
    if(val !== curVal){
      segs.push({t0:curTs, t1:frame.ts, val:curVal});
      curVal = val; curTs = frame.ts;
    }
  }
  if(curVal !== null) segs.push({t0:curTs, t1:recEndTs, val:curVal});
  return segs;
}

function addTlChannel(tagName){
  if(tlChannels.length >= TL_MAX_CHAN) return;
  if(tlChannels.find(c => c.tagName === tagName)) return;
  if(!allFrames.length) return;
  tlChannels.push({ tagName, segs: buildTagSegments(tagName) });
  renderTlChannels();
}

function removeTlChannel(tagName){
  tlChannels = tlChannels.filter(c => c.tagName !== tagName);
  renderTlChannels();
}

function renderTlChannels(){
  // Remove old channel rows
  document.querySelectorAll('.tl-chan').forEach(el => el.remove());

  // Show/hide Remove All button
  const rmBtn = document.getElementById('tl-remove-all');
  if(rmBtn) rmBtn.style.display = tlChannels.length ? '' : 'none';

  const dur = recEndTs - recStartTs;
  if(!dur) return;

  const inner = document.getElementById('tl-inner');
  tlChannels.forEach(ch => {
    const row = document.createElement('div');
    row.className = 'tl-chan';

    // Segments directly inside row (no wrapper — matches tl-track width)
    ch.segs.forEach(seg => {
      const el = document.createElement('div');
      el.className = 'tl-seg ' + (seg.val ? 'tl-seg-on' : 'tl-seg-off');
      const left = ((seg.t0 - recStartTs) / dur * 100).toFixed(3);
      const width = ((seg.t1 - seg.t0) / dur * 100).toFixed(3);
      el.style.left = left + '%';
      el.style.width = width + '%';
      el.dataset.tag = ch.tagName;
      el.dataset.val = seg.val;
      el.dataset.dur = seg.t1 - seg.t0;
      row.appendChild(el);
    });

    // Label overlay on top of segments
    const lbl = document.createElement('div');
    lbl.className = 'tl-chan-lbl';
    lbl.textContent = ch.tagName;
    lbl.title = ch.tagName + ' — right-click to remove';
    lbl.addEventListener('contextmenu', e => {
      e.preventDefault();
      removeTlChannel(ch.tagName);
    });
    row.appendChild(lbl);

    inner.appendChild(row);
  });

  renderHistVars();
}

function renderHistVars(){

  if(!panel) return;
  let html = '<div class="hist-var-title">HISTORY VARIABLES (' + tlChannels.length + ')</div>';
  if(!tlChannels.length){
    html += '<div class="hist-var-empty">No variables added.<br>Right-click a contact/coil on the graph &rarr; Add to Timeline.</div>';
  } else {

      const info = recSyms[ch.tagName] || {};

        + '</div>'
        + (desc ? '<div class="hist-var-desc">' + escapeHtml(desc) + '</div>' : '')
        + '</div>';
    });

}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function setTlZoom(val){
  tlZoom = Math.max(1, Math.min(20, parseFloat(val) || 1));
  const pct = (tlZoom - 1) / 19 * 100;
  document.getElementById('tl-zoom-thumb').style.left = 'calc(' + pct + '% - ' + (pct / 100 * 10) + 'px)';
  document.getElementById('tl-zoom-fill').style.width = pct + '%';
  document.getElementById('tl-zoom-val').textContent = (tlZoom === Math.floor(tlZoom) ? tlZoom : tlZoom.toFixed(1)) + 'x';
  document.getElementById('tl-inner').style.width = (tlZoom * 100) + '%';
  buildTimeline();
  tlScrollToCursor();
}

// Viscous zoom slider — 5:1 mouse-to-slider ratio
(function(){
  const track = document.getElementById('tl-zoom-track');
  const thumb = document.getElementById('tl-zoom-thumb');
  const DAMPING = 5; // 5x slower mouse movement

  thumb.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX;
    const startZoom = tlZoom;
    const trackW = track.offsetWidth;
    thumb.style.cursor = 'grabbing';

    function onMove(ev){
      const dx = ev.clientX - startX;
      // Map full track width to 1..20 range, dampened by 5x
      const dZoom = (dx / DAMPING) / trackW * 19;
      setTlZoom(startZoom + dZoom);
    }
    function onUp(){
      thumb.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Click on track — jump to position
  track.addEventListener('mousedown', e => {
    if(e.target === thumb) return;
    const rect = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setTlZoom(1 + pct * 19);
  });
})();

function tlScrollToCursor(){
  const bar = document.getElementById('tl-bar');
  const inner = document.getElementById('tl-inner');
  if(!inner || tlZoom <= 1) return;
  const dur = recEndTs - recStartTs;
  if(!dur) return;
  const pct = (currentRecTs - recStartTs) / dur;
  const innerW = inner.offsetWidth;
  const barW = bar.clientWidth;
  const cursorPx = pct * innerW;
  // Keep cursor at its anchor position within visible area
  bar.scrollLeft = cursorPx - barW * tlAnchorFrac;
}

function showCtxAddMenu(tagName, cx, cy){

function w2s(wx,wy){return{x:wx*cam.z+cam.x+canvas.width/2,y:wy*cam.z+cam.y+canvas.height/2};}
function s2w(sx,sy){return{x:(sx-canvas.width/2-cam.x)/cam.z,y:(sy-canvas.height/2-cam.y)/cam.z};}

function resize(){

  canvas.width = rect.width;

// ═══════════════════════════════════════════════════════
//  FILE LOADING
// ═══════════════════════════════════════════════════════
function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => loadRecording(e.target.result, file.name);
  reader.readAsText(file);
}

function loadRecording(text, fname){
  const lines = text.trim().split('\n');
  if(lines.length < 2){alert('Invalid .ndrec file');return;}

  const header = JSON.parse(lines[0]);
  if(header.type !== 'header'){alert('Missing header');return;}

  tagIndex = header.tagIndex || [];
  rec = header;
  tlChannels = [];
  setTlZoom(1);

  // History Variables panel starts closed for each new recording
  const _hvPanel = document.getElementById('hist-vars-panel');
  const _hvBtn = document.getElementById('btn-hist-vars');
  if(_hvPanel){ _hvPanel.classList.remove('open'); }
  if(_hvBtn){ _hvBtn.classList.remove('active'); }

  // Flatten all chunks into allFrames
  allFrames = [];
  for(let i = 1; i < lines.length; i++){
    const chunk = JSON.parse(lines[i]);
    if(chunk.type === 'chunk' && chunk.frames){
      allFrames.push(...chunk.frames);
    }
  }

  if(allFrames.length === 0){alert('No frames in recording');return;}

  // Find first full snapshot
  let baseIdx = 0;
  for(let i = 0; i < allFrames.length; i++){
    if(allFrames[i].v){baseIdx = i; break;}
  }
  baseValues = allFrames[baseIdx].v.slice();
  currentValues = baseValues.slice();

  recStartTs = allFrames[0].ts;
  recEndTs = allFrames[allFrames.length-1].ts;

  // Restore graph from snapshot
  if(header.graphSnap){
    graphData = header.graphSnap.graphData;
    if(header.graphSnap.cam) cam = {...header.graphSnap.cam};
    recSyms = header.graphSnap.syms || {};   // sym/desc map (empty for older recordings)
  }
  P = {syms: recSyms, isL5X: ((graphData && graphData.nodes) || []).some(n => n.rung && n.rung.rawNeutral)};

  // Build liveValues from current frame
  applyFrame(baseIdx);
  currentRecTs = allFrames[baseIdx].ts;
  buildScene();
  drawGraph();
  buildTimeline();

  document.getElementById('drop-overlay').classList.add('hidden');
  document.getElementById('rec-info').textContent =
    `${fname} | ${tagIndex.length} tags | ${allFrames.length} frames | ${((recEndTs-recStartTs)/1000).toFixed(1)}s`;

  frameIdx = baseIdx;
}

function applyFrame(idx){
  if(idx < 0 || idx >= allFrames.length) return;
  const f = allFrames[idx];
  const ts = (f.ts || 0) / 1000;

  if(f.v){
    // Full snapshot — full rebuild
    currentValues = f.v.slice();
    liveValues = {};
    for(let i = 0; i < tagIndex.length; i++){
      const val = currentValues[i];
      if(val !== undefined && val !== null)
        liveValues[tagIndex[i]] = {value: val, ts};
    }
  } else if(f.d){
    // Delta — update only changed tags
    for(const [ti, val] of f.d){
      currentValues[ti] = val;
      const name = tagIndex[ti];
      if(val !== undefined && val !== null)
        liveValues[name] = {value: val, ts};
      else
        delete liveValues[name];
    }
  }
}

function seekToFrame(idx){
  if(idx < 0) idx = 0;
  if(idx >= allFrames.length) idx = allFrames.length - 1;

  // To seek, we need to rebuild state from last full snapshot before idx
  let snapIdx = 0;
  for(let i = idx; i >= 0; i--){
    if(allFrames[i].v){snapIdx = i; break;}
  }
  currentValues = allFrames[snapIdx].v.slice();

  // Apply deltas from snapIdx+1 to idx
  for(let i = snapIdx + 1; i <= idx; i++){
    const f = allFrames[i];
    if(f.v) currentValues = f.v.slice();
    else if(f.d){
      for(const [ti, val] of f.d) currentValues[ti] = val;
    }
  }

  // Rebuild liveValues
  liveValues = {};
  const ts = (allFrames[idx].ts||0)/1000;
  for(let i = 0; i < tagIndex.length; i++){
    const name = tagIndex[i];
    const val = currentValues[i];
    if(val !== undefined && val !== null){
      liveValues[name] = {value: val, ts};
    }
  }

  frameIdx = idx;
  currentRecTs = allFrames[idx].ts;
  drawGraph();
  updateTimeline();
  updateTagPanel();

  // Reset playback time base so RAF continues from new position
  if(playing){
    playStartWall = performance.now();
    playStartRec = currentRecTs;
  }
}

// ═══════════════════════════════════════════════════════
//  PLAYBACK
// ═══════════════════════════════════════════════════════
function togglePlay(){
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? '\u23F8' : '\u25B6';
  if(playing) startPlayback();
  else stopPlayback();
}

function startPlayback(){
  if(frameIdx >= allFrames.length - 1){ frameIdx = 0; currentRecTs = recStartTs; }
  playStartWall = performance.now();
  playStartRec = currentRecTs;
  rafId = requestAnimationFrame(rafTick);
}

function stopPlayback(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  if(playTimer){ clearTimeout(playTimer); playTimer = null; }
}

function rafTick(now){
  if(!playing) return;

  const elapsed = (now - playStartWall) * playSpeed;
  const targetTs = playStartRec + elapsed;

  // Find the last frame with ts <= targetTs
  let newIdx = frameIdx;
  while(newIdx + 1 < allFrames.length && allFrames[newIdx + 1].ts <= targetTs){
    newIdx++;
  }

  currentRecTs = targetTs;

  if(newIdx >= allFrames.length - 1){
    // Reached end — apply all remaining frames sequentially
    for(let i = frameIdx + 1; i < allFrames.length; i++) applyFrame(i);
    frameIdx = allFrames.length - 1;
    currentRecTs = allFrames[frameIdx].ts;
    drawGraph();
    updateTimeline();
    updateTagPanel();
    playing = false;
    document.getElementById('btn-play').textContent = '\u25B6';
    return;
  }

  if(newIdx !== frameIdx){
    // Apply all intermediate deltas sequentially (don't skip)
    for(let i = frameIdx + 1; i <= newIdx; i++) applyFrame(i);
    frameIdx = newIdx;
    updateTagPanel();
  }

  // Smooth timeline/clock update using interpolated time
  updateTimelineSmooth(targetTs);

  // Always redraw — keeps visual effects smooth between data frames
  drawGraph();
  rafId = requestAnimationFrame(rafTick);
}

function stepFrame(dir){
  stopPlayback();
  playing = false;
  document.getElementById('btn-play').textContent = '\u25B6';
  seekToFrame(frameIdx + dir);
}

function setSpeed(s){
  playSpeed = s;
  document.getElementById('tl-speed').textContent = s + 'x';
  document.querySelectorAll('#tl-controls button').forEach(b=>{
    b.classList.toggle('active', b.textContent === s+'x');
  });
  // Recalculate time base so playback continues from current position
  if(playing){
    playStartWall = performance.now();
    playStartRec = currentRecTs;
  }
}

// ═══════════════════════════════════════════════════════
//  TIMELINE UI
// ═══════════════════════════════════════════════════════
function buildTimeline(){
  // Apply zoom width
  document.getElementById('tl-inner').style.width = (tlZoom * 100) + '%';

  buildTicks();
  updateTimeline();
  renderTlChannels();
}

// Build only the time-axis tick labels. Kept separate so a window/panel
// resize can refresh label density without re-rendering channel rows.
function buildTicks(){
  const ticks = document.getElementById('tl-ticks');
  if(!ticks) return;
  ticks.innerHTML = '';
  const dur = recEndTs - recStartTs;
  if(dur <= 0) return;

  // Pixel width of the (zoomed) timeline track. Spacing labels by pixels
  // — not by a fixed time step — keeps them readable for recordings of any
  // length, from a few seconds to several hours.
  const barW = document.getElementById('tl-bar').clientWidth || 800;
  const innerW = barW * tlZoom;

  // Aim for ~one label per MIN_LABEL_PX so they never collide.
  const MIN_LABEL_PX = 72;
  const maxLabels = Math.max(2, Math.floor(innerW / MIN_LABEL_PX));
  const desiredStep = dur / maxLabels;

  // Snap to a "nice" step from a ladder (ms): sub-second → seconds → minutes → hours.
  const STEPS = [100,200,500,1000,2000,5000,10000,15000,30000,
                 60000,120000,300000,600000,900000,1800000,
                 3600000,7200000,10800000,21600000,43200000,86400000];
  let step = STEPS[STEPS.length-1];
  for(const s of STEPS){ if(s >= desiredStep){ step = s; break; } }

  for(let t = 0; t <= dur; t += step){
    const pct = (t / dur * 100);
    const el = document.createElement('span');
    el.className = 'tl-tick';
    el.style.left = pct + '%';
    el.textContent = formatTick(t, step);
    ticks.appendChild(el);
  }
}

// Compact tick label whose precision adapts to the step size:
// coarse steps drop milliseconds; long recordings gain an hours field.
function formatTick(ms, step){
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const msPart = Math.floor(ms % 1000);
  const p2 = n => String(n).padStart(2,'0');
  const p3 = n => String(n).padStart(3,'0');
  if(step < 1000){
    return (h > 0 ? h + ':' + p2(m) : p2(m)) + ':' + p2(s) + '.' + p3(msPart);
  }
  return (h > 0 ? h + ':' + p2(m) : p2(m)) + ':' + p2(s);
}

function updateTimeline(){
  if(!allFrames.length) return;
  const dur = recEndTs - recStartTs;
  const elapsed = currentRecTs - recStartTs;
  const pct = dur > 0 ? (elapsed / dur * 100) : 0;
  document.getElementById('tl-fill').style.width = pct + '%';
  document.getElementById('tl-cursor').style.left = pct + '%';
  document.getElementById('tl-time').textContent = formatTime(elapsed) + ' / ' + formatTime(dur);
  updateRecClock(currentRecTs);
}

function updateTimelineSmooth(interpTs){
  if(!allFrames.length) return;
  const dur = recEndTs - recStartTs;
  // Clamp to recording bounds
  const clamped = Math.min(Math.max(interpTs, recStartTs), recEndTs);
  const elapsed = clamped - recStartTs;
  const pct = dur > 0 ? (elapsed / dur * 100) : 0;
  document.getElementById('tl-fill').style.width = pct + '%';
  document.getElementById('tl-cursor').style.left = pct + '%';
  document.getElementById('tl-time').textContent = formatTime(elapsed) + ' / ' + formatTime(dur);
  updateRecClock(clamped);
  // Auto-scroll when zoomed during playback
  if(tlZoom > 1 && playing) tlScrollToCursor();
}

function updateRecClock(ts){
  const el = document.getElementById('rec-clock');
  if(!el || !ts) return;
  const d = new Date(ts);
  el.textContent = String(d.getHours()).padStart(2,'0') + ':'
    + String(d.getMinutes()).padStart(2,'0') + ':'
    + String(d.getSeconds()).padStart(2,'0') + '.'
    + String(d.getMilliseconds()).padStart(3,'0');
  el.style.display = 'block';
}

function formatTime(ms){
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const ss = s % 60;
  const mmm = Math.floor(ms % 1000);
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(mmm).padStart(3,'0')}`;
}

function tlSeekToTs(targetTs){
  // Move visual cursor to exact position
  currentRecTs = Math.max(recStartTs, Math.min(recEndTs, targetTs));

  // Find last frame with ts <= targetTs (floor, not nearest)
  let best = 0;
  for(let i = 0; i < allFrames.length; i++){
    if(allFrames[i].ts <= targetTs) best = i;
    else break;
  }

  // Only rebuild state & redraw graph if frame actually changed
  if(best !== frameIdx){
    // Rebuild state from last snapshot
    let snapIdx = 0;
    for(let i = best; i >= 0; i--){
      if(allFrames[i].v){ snapIdx = i; break; }
    }
    currentValues = allFrames[snapIdx].v.slice();
    for(let i = snapIdx + 1; i <= best; i++){
      const f = allFrames[i];
      if(f.v) currentValues = f.v.slice();
      else if(f.d) for(const [ti, val] of f.d) currentValues[ti] = val;
    }
    liveValues = {};
    const ts = (allFrames[best].ts || 0) / 1000;
    for(let i = 0; i < tagIndex.length; i++){
      const val = currentValues[i];
      if(val !== undefined && val !== null)
        liveValues[tagIndex[i]] = { value: val, ts };
    }
    frameIdx = best;
    drawGraph();
    updateTagPanel();
  }

  // Always update timeline cursor position (even if frame didn't change)
  updateTimeline();

  // Update anchor: remember where cursor sits in visible bar
  if(tlZoom > 1){
    const bar = document.getElementById('tl-bar');
    const inner = document.getElementById('tl-inner');
    if(inner){
      const cursorPx = ((currentRecTs - recStartTs) / (recEndTs - recStartTs)) * inner.offsetWidth;
      tlAnchorFrac = Math.max(0, Math.min(1, (cursorPx - bar.scrollLeft) / bar.clientWidth));
    }
  }

  // Reset playback time base
  if(playing){
    playStartWall = performance.now();
    playStartRec = currentRecTs;
  }
}

// Timeline mouse interaction — click + drag scrubbing
(function(){
  const bar = document.getElementById('tl-bar');

  function getTsFromEvent(e){
    const track = document.getElementById('tl-track');
    const rect = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    return recStartTs + pct * (recEndTs - recStartTs);
  }

  bar.addEventListener('mousedown', e => {
    if(e.button !== 0) return; // left button only
    if(!allFrames.length) return;
    // Don't start drag if clicking on channel label
    if(e.target.closest('.tl-chan-lbl')) return;
    e.preventDefault();
    tlDragging = true;
    const wasPlaying = playing;
    if(playing){ stopPlayback(); playing = false; document.getElementById('btn-play').textContent = '\u25B6'; }
    tlSeekToTs(getTsFromEvent(e));

    function onMove(ev){
      if(!tlDragging) return;
      ev.preventDefault();
      tlSeekToTs(getTsFromEvent(ev));
    }

    function onUp(ev){
      tlDragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Update anchor when user manually scrolls the timeline bar
  bar.addEventListener('scroll', () => {
    if(tlZoom > 1 && !playing){
      const inner = document.getElementById('tl-inner');
      if(!inner) return;
      const dur = recEndTs - recStartTs;
      if(!dur) return;
      const cursorPx = ((currentRecTs - recStartTs) / dur) * inner.offsetWidth;
      tlAnchorFrac = Math.max(0, Math.min(1, (cursorPx - bar.scrollLeft) / bar.clientWidth));
    }
  });
})();

// ═══════════════════════════════════════════════════════
//  TAG PANEL
// ═══════════════════════════════════════════════════════
function toggleTagPanel(){
  const p = document.getElementById('tag-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) updateTagPanel();
}

function updateTagPanel(){
  const p = document.getElementById('tag-panel');
  if(!p.classList.contains('open')) return;

  // Collect tags that appear in the graph
  const graphTags = new Map();   // tag → {t, prog}
  if(graphData && graphData.nodes){
    graphData.nodes.forEach(n=>{
      if(n.rung && n.rung.ins){
        const prog = (n.rung.file || '').split('/')[0] || null;
        n.rung.ins.forEach(ins=>{ if(ins.g && !graphTags.has(ins.g)) graphTags.set(ins.g, {t:ins.t, prog}); });
      }
    });
  }

  let html = '<div style="font-family:var(--mono);font-size:11px;color:var(--acc);padding:4px 6px;border-bottom:1px solid var(--border);">TAGS ON GRAPH</div>';
  const sorted = [...graphTags.keys()].sort();
  for(const tag of sorted){
    const lv = liveValues[tag];
    const {t, prog} = graphTags.get(tag);
    const vt = lv ? tagValueText(tag, lv, prog, t) : null;
    const v = vt === null ? '-' : vt;
    const cls = v === '1' ? 'on' : v === '0' ? 'off' : '';
    html += `<div class="tag-row"><span class="tag-name">${tag}</span><span class="tag-val ${cls}">${v}</span></div>`;
  }
  p.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  L5X TOKENIZER
// ═══════════════════════════════════════════════════════
function splitTopCommas(s){
  const parts=[];let depth=0,cur='';
  for(const c of s){
    if(c==='(')depth++;else if(c===')')depth--;
    else if(c===','&&depth===0){parts.push(cur.trim());cur='';continue;}
    cur+=c;
  }
  if(cur.trim())parts.push(cur.trim());
  return parts.filter(Boolean);
}

function tokeniseL5X(text){
  const tokens=[];let i=0;const n=text.length;
  const ws=()=>{while(i<n&&/\s/.test(text[i]))i++;};
  while(i<n){
    ws();if(i>=n||text[i]===';')break;
    if(text[i]==='['){tokens.push({type:'bst'});i++;continue;}
    if(text[i]===']'){tokens.push({type:'bnd'});i++;continue;}
    if(text[i]===','){tokens.push({type:'nxb'});i++;continue;}
    const identStart=i;
    while(i<n&&/[A-Za-z0-9_]/.test(text[i]))i++;
    const ident=text.slice(identStart,i);
    if(!ident){i++;continue;}
    ws();let ops=[];
    if(i<n&&text[i]==='('){
      let depth=0,start=i;
      while(i<n){if(text[i]==='(')depth++;else if(text[i]===')'){depth--;if(depth===0){i++;break;}}i++;}
      const inner=text.slice(start+1,i-1);
      ops=splitTopCommas(inner);
    }
    if(ident)tokens.push({type:'inst',inst:ident,ops});
  }
  return tokens;
}

function normalizeL5XInst(inst){return L5X_INST_MAP[inst.toUpperCase()]||inst.toUpperCase();}

function parseAddrRoleL5X(inst){
  if(inst==='JMP'||inst==='LBL')return'label';
  if(inst==='GSV')return'out';if(inst==='SSV')return'in';
  if(inst==='BTD')return'out';
  if(L5X_OUT_INST.has(inst))return'out';
  if(L5X_MATH_DEST.has(inst))return'out';
  if(L5X_BOTH_INST.has(inst))return'both';
  return'in';
}

function parseAddrRole(inst){
  if(OUT_I.has(inst))return'out';
  if(MATH_DEST_I.has(inst))return'out';
  if(inst==='CPT')return'out';if(inst==='IOM')return'out';
  if(['TON','TOF','RTO','CTU','CTD','RES','PID'].includes(inst))return'both';
  if(['COP','FLL'].includes(inst))return'out';
  return'in';
}

function normalizeAddr(a){
  const m=a.match(/^([IO]):(\d+)\.(\d+)\/(\d+)$/i);
  if(m){const slot=m[2],word=parseInt(m[3]),bit=parseInt(m[4]);return `${m[1].toUpperCase()}:${slot}/${word*16+bit}`;}
  return a;
}
function stripHash(s){return s.startsWith('#')?s.slice(1):s;}
function looksLikeAddr(s){const c=stripHash(s);return/^[A-Za-z]/.test(c)&&/[:/.\[\]]/.test(c);}

// ═══════════════════════════════════════════════════════
//  RUNG PARSERS
// ═══════════════════════════════════════════════════════
const SKIP_TOK = new Set(['SOR','EOR','AFI','NOP','RET','RET_HOME']);
function isMnemonic(tok){return /^[A-Z]{2,5}$/.test(tok)&&tok!=='BST'&&tok!=='NXB'&&tok!=='BND';}

function parseRungTextTree(text){
  const raw=(text||'').trim().split(/\s+/).filter(t=>t);
  let pos=0;
  function peek(){return raw[pos];}
  function consume(){return raw[pos++];}
  function parseOperands(){
    const ops=[];
    while(pos<raw.length){
      const t=raw[pos];
      if(t==='BST'||t==='NXB'||t==='BND'||t==='EOR')break;
      if(isMnemonic(t)||SKIP_TOK.has(t))break;
      ops.push(consume());
    }
    return ops;
  }
  function makeInstNode(mnem,ops){
    let g=ops[0]||'';
    if((mnem==='JSR'||mnem==='JMP'||mnem==='LBL')&&ops.length>=1&&/^\d+$/.test(ops[0])){
      g='U3:'+ops[0];
      return{type:'inst',inst:{t:mnem,g,r:mnem==='JSR'?'out':'in',operands:ops,fileNum:ops[0]}};
    }
    ops=ops.map(stripHash);g=stripHash(g);
    if(mnem==='CPT'&&ops.length>=1){g=ops[0];g=normalizeAddr(g);return{type:'inst',inst:{t:mnem,g,r:'out',operands:ops}};}
    if((mnem==='COP'||mnem==='FLL')&&ops.length>=2){g=ops[1];g=normalizeAddr(g);return{type:'inst',inst:{t:mnem,g,r:'out',operands:ops}};}
    if(mnem==='PID'&&ops.length>=1){g=ops[0];g=normalizeAddr(g);return{type:'inst',inst:{t:mnem,g,r:'both',operands:ops}};}
    if((mnem==='IIM'||mnem==='IOM')&&ops.length>=1){g=ops[0];g=normalizeAddr(g);return{type:'inst',inst:{t:mnem,g,r:mnem==='IOM'?'out':'in',operands:ops}};}
    // FFL/FFU/LFL/LFU: primary address is the CONTROL structure, as in the tracer
    if(FIFO_I.has(mnem)&&ops.length>=3&&looksLikeAddr(ops[2])){g=normalizeAddr(ops[2]);return{type:'inst',inst:{t:mnem,g,r:'both',operands:ops}};}
    if(mnem==='LIM'&&ops.length>=2)g=ops[1]||g;
    if(MATH_DEST_I.has(mnem)&&ops.length>=1){const last=ops[ops.length-1];if(looksLikeAddr(last)&&!/^-?[\d.]+$/.test(last))g=last;}
    g=normalizeAddr(g);
    return{type:'inst',inst:{t:mnem,g,r:parseAddrRole(mnem),operands:ops}};
  }
  function parseSeq(){
    const children=[];
    while(pos<raw.length){
      const t=peek();if(!t||t==='BND'||t==='EOR')break;
      if(t==='BST'){consume();children.push(parsePar());}
      else if(t==='NXB'||t==='BND')break;
      else if(SKIP_TOK.has(t))consume();
      else if(isMnemonic(t)){
        consume();const ops=parseOperands();
        const hasMeaningfulOp=ops.length>0&&(/^[#A-Za-z]/.test(ops[0])||(MATH_DEST_I.has(t)&&ops.length>=2)||(t==='CPT'&&ops.length>=1)||((t==='COP'||t==='FLL')&&ops.length>=2)||(t==='LIM'&&ops.length>=2&&/^[#A-Za-z]/.test(ops[1]))||((t==='JSR'||t==='JMP'||t==='LBL')&&/^\d+$/.test(ops[0])));
        if(hasMeaningfulOp)children.push(makeInstNode(t,ops));
      }else consume();
    }
    if(children.length===0)return null;
    if(children.length===1)return children[0];
    return{type:'seq',children};
  }
  function parsePar(){
    const branches=[];let b=parseSeq();if(b)branches.push(b);
    while(pos<raw.length&&peek()==='NXB'){consume();b=parseSeq();if(b)branches.push(b);}
    if(pos<raw.length&&peek()==='BND')consume();
    if(branches.length===0)return{type:'seq',children:[]};
    if(branches.length===1)return branches[0];
    return{type:'par',children:branches};
  }
  const tree=parseSeq();
  return tree||{type:'seq',children:[]};
}

// First operand naming a tag rather than a literal — EQU(1000,Step) used to
// pin the constant onto the cell, which then resolved nothing. Mirrors tracer.
function firstTagOperand(ops){
  for(const op of ops){ if(op && /^[A-Za-z_]/.test(op) && !/^-?[\d.]+$/.test(op)) return op; }
  return '';
}
function parseL5XRungTree(neutralText){
  if(!neutralText)return{type:'seq',children:[]};
  const tokens=tokeniseL5X(neutralText);let pos=0;
  const L5X_SKIP=new Set(['NOP','END','ENDTASK']);
  function makeInstNode(tok){
    const inst=normalizeL5XInst(tok.inst);
    if(L5X_SKIP.has(inst))return null;
    // AFI kills the rung — mirrors the tracer, which stopped dropping it.
    if(inst==='AFI')return{type:'inst',inst:{t:'AFI',g:'__afi',r:'in',operands:[]}};
    const ops=tok.ops.map(s=>s.trim()).filter(s=>s&&s!=='?');
    let addr=ops[0]||'';
    if(inst==='JSR'){if(ops[0])return{type:'inst',inst:{t:'JSR',g:'__label:'+ops[0],r:'label',operands:ops,fileNum:ops[0]}};return null;}
    if(inst==='SBR'){if(ops[0])return{type:'inst',inst:{t:'SBR',g:ops[0],r:'out',operands:ops}};return null;}
    if(inst==='RET'){const retAddr=(ops[0]&&/^[A-Za-z_]/.test(ops[0])&&!/^-?[\d.]+$/.test(ops[0]))?ops[0]:'__ret';return{type:'inst',inst:{t:'RET',g:retAddr,r:'out',operands:ops}};}
    if(inst==='JMP'||inst==='LBL'){if(ops[0])return{type:'inst',inst:{t:inst,g:'__label:'+ops[0],r:'label',operands:ops,fileNum:ops[0]}};return null;}
    if((inst==='LIM'||inst==='LIMIT')&&ops.length>=2)addr=ops[1]||addr;
    if((inst==='GSV'||inst==='SSV')&&ops.length>=1){const last=ops[ops.length-1];if(/^[A-Za-z_]/.test(last)&&!/^-?[\d.]+$/.test(last))addr=last;}
    else if(inst==='BTD'&&ops.length>=3){const dst=ops[2];if(/^[A-Za-z_]/.test(dst)&&!/^-?[\d.]+$/.test(dst))addr=dst;}
    else if(inst==='CPT'&&ops.length>=1)addr=ops[0];
    else if(inst==='FLL'&&ops.length>=2)addr=ops[1];
    else if((inst==='COP'||inst==='CPS')&&ops.length>=2)addr=ops[1];
    // AVE destination is ops[2]; SRT sorts its array in place (mirrors tracer)
    else if(inst==='AVE'&&ops.length>=3)addr=ops[2];
    else if(inst==='SRT'&&ops.length>=1)addr=ops[0];
    else if(L5X_MATH_DEST.has(inst)&&ops.length>=2){const last=ops[ops.length-1];if(/^[A-Za-z_]/.test(last)&&!/^-?[\d.]+$/.test(last))addr=last;}
    if(!addr||/^-?[\d.]+$/.test(addr))addr=firstTagOperand(ops)||ops[0]||'?';
    return{type:'inst',inst:{t:inst,g:addr,r:parseAddrRoleL5X(inst),operands:ops}};
  }
  function parseSeq(){
    const children=[];
    while(pos<tokens.length){
      const tok=tokens[pos];
      if(tok.type==='bnd')break;if(tok.type==='nxb')break;
      if(tok.type==='bst'){pos++;children.push(parsePar());}
      else if(tok.type==='inst'){pos++;const node=makeInstNode(tok);if(node)children.push(node);}
      else pos++;
    }
    if(children.length===0)return null;
    if(children.length===1)return children[0];
    return{type:'seq',children};
  }
  function parsePar(){
    const branches=[];let b=parseSeq();if(b)branches.push(b);
    while(pos<tokens.length&&tokens[pos].type==='nxb'){pos++;b=parseSeq();if(b)branches.push(b);}
    if(pos<tokens.length&&tokens[pos].type==='bnd')pos++;
    if(branches.length===0)return{type:'seq',children:[]};
    if(branches.length===1)return branches[0];
    return{type:'par',children:branches};
  }
  const tree=parseSeq();
  return tree||{type:'seq',children:[]};
}

// ═══════════════════════════════════════════════════════
//  TREE MEASURE & LAYOUT
// ═══════════════════════════════════════════════════════
function measureTree(tree){
  if(!tree)return{w:CW,h:CH};
  if(tree.type==='inst')return{w:CW,h:CH};
  if(tree.type==='seq'){
    let inW=0,outW=0,h=CH;
    tree.children.forEach(c=>{const m=measureTree(c);const isOut=c.type==='inst'&&(c.inst.r==='out'||c.inst.r==='both');if(isOut)outW+=m.w;else inW+=m.w;h=Math.max(h,m.h);});
    return{w:Math.max(inW+outW,CW),h};
  }
  if(tree.type==='par'){
    const ms=tree.children.map(c=>measureTree(c));
    const w=Math.max(...ms.map(m=>m.w),CW);
    const h=ms.reduce((s,m)=>s+m.h,0)+(ms.length-1)*BRANCH_GAP;
    return{w,h};
  }
  return{w:CW,h:CH};
}

function layoutTree(tree,ox,oy,availH){
  if(!tree)return[];
  if(tree.type==='inst')return[{inst:tree.inst,x:ox,y:oy,w:CW,h:availH}];
  if(tree.type==='seq'){
    let cx=ox;const hits=[];
    tree.children.forEach(c=>{const m=measureTree(c);hits.push(...layoutTree(c,cx,oy,availH));cx+=m.w;});
    return hits;
  }
  if(tree.type==='par'){
    const ms=tree.children.map(c=>measureTree(c));
    let cy=oy;const hits=[];
    tree.children.forEach((c,i)=>{const bH=ms[i].h;hits.push(...layoutTree(c,ox,cy,bH));cy+=bH+BRANCH_GAP;});
    return hits;
  }
  return[];
}

// ═══════════════════════════════════════════════════════
//  BUILD SCENE
// ═══════════════════════════════════════════════════════
function buildScene(){
  if(!graphData) return;
  const rungNodes = graphData.nodes.filter(n=>n.kind==='rung');
  const edges = graphData.edges || [];

  // Build requestedFrom map: find which rung requested which
  // Edges with explicitLink=true have requestingRungId
  const requestedFrom = new Map();
  for(const e of edges){
    if(e.explicitLink && e.requestingRungId){
      // e.from is the writer rung, it was requested by e.requestingRungId
      if(!requestedFrom.has(e.from)){
        requestedFrom.set(e.from, e.requestingRungId);
      }
    }
  }

  // Determine root rung (not requested by anyone)
  const requestedIds = new Set(requestedFrom.keys());
  const rootNodes = rungNodes.filter(n => !requestedIds.has(n.id));
  const childNodes = rungNodes.filter(n => requestedIds.has(n.id));

  // Sort root nodes by file/rung
  rootNodes.sort((a,b)=>{
    const fa=parseInt((a.rung.file||'').replace(/\D/g,''))||0;
    const fb=parseInt((b.rung.file||'').replace(/\D/g,''))||0;
    if(fa!==fb)return fa-fb;
    return a.rung.rungNum-b.rung.rungNum;
  });

  // Build tree and measure for all rung nodes (indexed by id)
  const nodeMap = new Map();
  rungNodes.forEach(rn => nodeMap.set(rn.id, rn));

  function buildRungEntry(rn){
    const rg = rn.rung;
    let tree;
    if(rg.rawNeutral) tree = parseL5XRungTree(rg.rawNeutral);
    else tree = parseRungTextTree(rg.text||rg.ins.map(i=>`${i.t} ${(i.operands||[i.g]).join(' ')}`).join(' '));
    const m = measureTree(tree);
    const totalH = Math.max(m.h, CH);
    const hits = layoutTree(tree, 0, 0, totalH);
    const myRailR = Math.max(m.w, CW*2);
    return {rung:rg, rungId:rn.id, tree, railL:0, railR:myRailR, totalH, hits};
  }

  // Collision check
  function isOccupied(testOx, testOy, testW, testH){
    for(const s of ladderScene){
      const sLeft=s.ox+s.railL,sRight=s.ox+s.railR,sTop=s.oy-HDR_H,sBot=s.oy+s.totalH;
      const tLeft=testOx,tRight=testOx+testW,tTop=testOy-HDR_H,tBot=testOy+testH;
      if(tRight>sLeft&&tLeft<sRight&&tBot>sTop&&tTop<sBot)return true;
    }
    return false;
  }

  ladderScene = [];
  let bottomY = 0;

  // Pass 1: place root rungs vertically
  rootNodes.forEach(rn=>{
    const entry = buildRungEntry(rn);
    entry.ox = -entry.railR/2;
    entry.oy = bottomY;
    ladderScene.push(entry);
    bottomY += entry.totalH + HDR_H + RUNG_GAP;
  });

  // Pass 2: place requested rungs near their parent
  const sceneById = new Map();
  ladderScene.forEach(s => sceneById.set(s.rungId, s));

  const queue = [...childNodes];
  let maxIter = queue.length * 3 + 1;
  while(queue.length > 0 && maxIter-- > 0){
    let placedIdx = -1;
    for(let i = 0; i < queue.length; i++){
      const parentId = requestedFrom.get(queue[i].id);
      if(sceneById.has(parentId)){placedIdx = i; break;}
    }
    if(placedIdx === -1) break;

    const rn = queue.splice(placedIdx, 1)[0];
    const parentId = requestedFrom.get(rn.id);
    const parentScene = sceneById.get(parentId);
    const entry = buildRungEntry(rn);
    const rungW = entry.railR;

    // Try below parent first
    let belowOy = parentScene.oy + parentScene.totalH + HDR_H + RUNG_GAP;
    let belowOx = parentScene.ox;
    if(!isOccupied(belowOx, belowOy, rungW, entry.totalH)){
      entry.ox = belowOx;
      entry.oy = belowOy;
    } else {
      // Column right of parent
      const colStep = parentScene.railR + RUNG_GAP + 40;
      entry.ox = parentScene.ox + colStep;
      entry.oy = parentScene.oy;
      while(isOccupied(entry.ox, entry.oy, rungW, entry.totalH)){
        entry.oy += CH + HDR_H + RUNG_GAP;
      }
    }

    ladderScene.push(entry);
    sceneById.set(rn.id, entry);
  }

  // Place any remaining unplaced rungs
  queue.forEach(rn=>{
    const entry = buildRungEntry(rn);
    entry.ox = -entry.railR/2;
    entry.oy = bottomY;
    ladderScene.push(entry);
    bottomY += entry.totalH + HDR_H + RUNG_GAP;
  });
}

// ═══════════════════════════════════════════════════════
//  VALUE RESOLUTION
// ═══════════════════════════════════════════════════════
function parsePlcLiteral(s){
  if(!s)return null;
  if(/^-?[\d.]+$/.test(s)){const n=parseFloat(s);return isNaN(n)?null:n;}
  const hexL=s.match(/^16#([0-9A-Fa-f_]+)$/);if(hexL)return parseInt(hexL[1].replace(/_/g,''),16);
  const binL=s.match(/^2#([01_]+)$/);if(binL)return parseInt(binL[1].replace(/_/g,''),2);
  const octL=s.match(/^8#([0-7_]+)$/);if(octL)return parseInt(octL[1].replace(/_/g,''),8);
  return null;
}

function resolveLV(tagName){
  const qualKey = currentRungProg && !tagName.startsWith(currentRungProg+'.')
    ? `${currentRungProg}.${tagName}` : null;
  if(qualKey && liveValues[qualKey]) return liveValues[qualKey];
  if(liveValues[tagName]) return liveValues[tagName];

  // Bit extraction: Tag.N where N is numeric
  if(tagName){
    const dotIdx = tagName.lastIndexOf('.');
    if(dotIdx > 0){
      const parentPart = tagName.slice(0, dotIdx);
      const bitPart = tagName.slice(dotIdx + 1);
      if(/^\d+$/.test(bitPart)){
        const parentLv = resolveLV(parentPart);
        if(parentLv && parentLv.value !== undefined){
          const intVal = parseInt(parentLv.value);
          const bitNum = parseInt(bitPart);
          if(!isNaN(intVal) && bitNum >= 0 && bitNum < 64){
            return {value: (intVal >> bitNum) & 1, ts: parentLv.ts};
          }
        }
      }
    }
  }
  return null;
}

function cellState(inst){
  if(inst.t === 'AFI') return 'off';   // no tag to resolve; never conducts
  // FFL/FFU/LFL/LFU are lit by their CONTROL edge-memory bit, not by the
  // scalar value of whichever operand happens to be the primary address.
  if(FIFO_I.has(inst.t)){
    const _fp = fifoParts(inst);
    const _eb = _fp ? fifoCtlBit(_fp.ctl, _fp.enBit) : null;
    return _eb === null ? null : (_eb ? 'on' : 'off');
  }
  const lv = resolveLV(inst.g);
  if(!lv || lv.error) return null;
  const v = lv.value, t = inst.t;

  if(t==='XIC'||t==='ONS')return v?'on':'off';
  if(t==='XIO')return v?'off':'on';
  if(t==='OSR')return v?'on':'off';
  if(t==='OSF')return v?'off':'on';
  if(t==='OTE'||t==='OTL'||t==='OTU')return v?'on':'off';

  if(t==='TON'||t==='TOF'||t==='RTO'){
    const dn=resolveLV(inst.g+'.DN');const en=resolveLV(inst.g+'.EN');
    if(dn)return dn.value?'on':(en?.value?'timing':'off');
    return v?'on':'off';
  }
  if(t==='CTU'||t==='CTD'||t==='RES'){
    const dn=resolveLV(inst.g+'.DN');
    if(dn)return dn.value?'on':'off';
    return v?'on':'off';
  }
  if(['EQU','GRT','LES','GEQ','LEQ','NEQ','LIM'].includes(t)){
    // LIM(LowLimit, Test, HighLimit): inst.g is Test (operands[1]), so the
    // two-operand path below compared Test with itself and always returned null
    // — a LIM cell never showed a state. Mirrors the tracer: true when
    // Low <= Test <= High, inverted (Test <= High OR Test >= Low) when Low > High.
    if(t==='LIM'&&inst.operands&&inst.operands.length>=3){
      const numOf=a=>{
        const litv=parsePlcLiteral(a);
        if(litv!==null)return litv;
        const l=resolveLV(a);
        return l?parseFloat(l.value):NaN;
      };
      const lo=numOf(inst.operands[0]),te=numOf(inst.operands[1]),hi=numOf(inst.operands[2]);
      if(isNaN(lo)||isNaN(te)||isNaN(hi))return null;
      return (lo<=hi)?((te>=lo&&te<=hi)?'on':'off'):((te<=hi||te>=lo)?'on':'off');
    }
    if(inst.operands&&inst.operands.length>=2){
      // Source A positionally from operands[0]: when it is a constant, inst.g
      // holds the other operand and reading through it self-compares.
      const srcA=inst.operands[0];
      const litA=parsePlcLiteral(srcA);
      let fv;
      if(litA!==null) fv=litA;
      else { const lvA=(srcA===inst.g)?lv:resolveLV(srcA); fv=lvA?parseFloat(lvA.value):NaN; }
      const srcB=inst.operands[1];const lvB=resolveLV(srcB);
      const litB=parsePlcLiteral(srcB);
      const cmp=lvB?parseFloat(lvB.value):(litB!==null?litB:parseFloat(srcB));
      if(!isNaN(cmp)&&!isNaN(fv)){
        if(t==='EQU')return fv===cmp?'on':'off';
        if(t==='NEQ')return fv!==cmp?'on':'off';
        if(t==='GRT')return fv>cmp?'on':'off';
        if(t==='GEQ')return fv>=cmp?'on':'off';
        if(t==='LES')return fv<cmp?'on':'off';
        if(t==='LEQ')return fv<=cmp?'on':'off';
      }
    }
    return null;
  }
  return 'numeric';
}

// ═══════════════════════════════════════════════════════
//  TOOLTIP
//  The block below is the tracer's own, byte for byte (test_tooltip_same.js).
//  These are the tracer helpers it needs that the player did not have.
// ═══════════════════════════════════════════════════════
function getDesc(addr){ return recSyms[addr] || null; }
function addrType(a){
  const m=a.match(/^([A-Za-z]+)\d*[:/]/);
  if(!m)return'?';
  const p=m[1].toUpperCase();
  const MAP={I:'I',O:'O',B:'B',N:'N',F:'F',T:'T',C:'C',R:'R',S:'S',A:'A',MG:'MG',PD:'PD'};
  return MAP[p]||p;
}
function typeLabel(t){
  return{I:'INPUT',O:'OUTPUT',B:'BIT',N:'INTEGER',F:'FLOAT',T:'TIMER',C:'COUNTER',R:'CONTROL',S:'STATUS',A:'ASCII',MG:'MESSAGE',U:'SUBROUTINE'}[t]||t;
}
function isBinaryWordAddr(addr){
  return /^B\d+:\d+$/i.test(addr);
}
function assembleBinaryWord(addr){
  if(!isBinaryWordAddr(addr)) return null;
  let word = 0;
  let anyBit = false;
  for(let bit = 0; bit < 16; bit++){
    const lv = resolveLV(addr + '/' + bit);
    if(lv && lv.value !== undefined){
      anyBit = true;
      if(lv.value) word |= (1 << bit);
    }
  }
  return anyBit ? word : null;
}
function toBin16(val){
  return (val >>> 0).toString(2).padStart(16, '0').slice(-16);
}

// ── TOOLTIP ──
// One tooltip for every block: this whole block, down to END TOOLTIP, is byte for
// byte the same in PLC-tracer-HMI.html, plc-tracer-500-v160.html and
// PLC_Tracer_Player.html (test_tooltip_same.js). The player supplies P, getDesc and
// the address helpers from its recording, so nothing here knows which page it is in.
//
// Timer time base. SLC 500 / MicroLogix keep it in the instruction itself
// (TON T4:1 1.0 10 0 → 1.0 s; bit 9 of the control word mirrors it), so it is
// known offline. Logix has no time base: TIMER .PRE/.ACC always count ms.
const TIMER_BASE_I = new Set(['TON','TOF','RTO','TONR','TOFR','RTOR']);
function timerBase(t, ops){
  if(!TIMER_BASE_I.has(t)) return null;
  if(P && P.isL5X) return {sec:0.001, txt:'0.001 s', note:'1 ms, fixed'};
  const op = ops && ops[1];
  // Only a genuine base — a short "TON T4:0 3000" must not read its preset as one
  if(typeof op !== 'string' || !op.includes('.') || ![1, 0.01, 0.001].includes(parseFloat(op))) return null;
  return {sec:parseFloat(op), txt:`${op} s`, note:''};
}
// "(10 s)" after a PRE/ACC value; '' when the base or the value is unknown.
// toFixed(3) drops float noise (100 × 0.001) — no base is finer than 1 ms.
function timerSecsNote(lv, tb){
  const v = lv && !lv.error ? lv.value : null;
  const n = (v === null || v === undefined || v === '') ? NaN : Number(v);
  if(!tb || !isFinite(n)) return '';
  return `<span class="tt-ops-val" style="color:var(--text3);font-size:9px;margin-left:4px">(${+(n * tb.sec).toFixed(3)} s)</span>`;
}

// ── One value format, online and offline ──
// The same tag arrives as true/false from the bridge and as 1/0 from a PRN or L5X
// file. A bare SLC structure arrives as {CTL,PRE,ACC} or {CTL,LEN,POS} online, but
// as a plain number from a PRN and as "PRE:x ACC:y" from an L5X. Every text that
// prints a value goes through these helpers, so it reads the same in all of them.
const TT_TC_I = new Set(['TON','TOF','RTO','TONR','TOFR','RTOR','CTU','CTD','CTUD']);

// A sub-member of a structure, in both spellings: the bridge answers T4:0.DN, a
// PRN stores T4:0/DN. null when it is unknown or came back with a read error.
function tagSubLV(addr, sub, prog){
  const saved = currentRungProg;
  if(prog) currentRungProg = prog;
  const lv = resolveLV(`${addr}.${sub}`) || resolveLV(`${addr}/${sub}`);
  currentRungProg = saved;
  return (lv && !lv.error && lv.value !== undefined && lv.value !== null) ? lv : null;
}

// 'tc' = TIMER or COUNTER element, 'ctl' = CONTROL element, null = anything else.
function lvStructKind(addr, prog, instType){
  if(TT_TC_I.has(instType)) return 'tc';
  if(FIFO_I.has(instType))  return 'ctl';
  if(!addr) return null;
  if(P && P.isL5X){
    const q  = prog && !addr.startsWith(prog + '.') ? `${prog}.${addr}` : null;
    const dt = String(((q && P.syms[q]) || P.syms[addr] || {}).dataType || '').toUpperCase();
    return (dt === 'TIMER' || dt === 'COUNTER') ? 'tc' : dt === 'CONTROL' ? 'ctl' : null;
  }
  return /^[TC]\d*:\d+$/i.test(addr) ? 'tc' : /^R\d*:\d+$/i.test(addr) ? 'ctl' : null;
}

// One raw value as text: a bit is 1/0, a structure from the bridge is its DN bit
// (bit 13 of the control word) or POS/LEN.
function lvText(v){
  if(v === true || v === false) return v ? '1' : '0';
  if(Array.isArray(v)) return `[${v.length} bytes]`;
  if(v && typeof v === 'object'){
    if(v.PRE !== undefined) return String((v.CTL >> 13) & 1);
    if(v.LEN !== undefined) return `${v.POS}/${v.LEN}`;
    return JSON.stringify(v);
  }
  return String(v);
}

// The radix a tag was exported in (16#0000_0079), applied to the value it has now:
// the text in the L5X file is only right until the value changes.
function radixText(raw, v){
  const m = /^(16|2|8)#([0-9A-Fa-f_]+)$/.exec(String(raw));
  const n = (v === true || v === false) ? (v ? 1 : 0) : Number(v);
  if(!m || !Number.isInteger(n)) return String(raw);
  const base = +m[1], parts = m[2].split('_'), width = parts.join('').length;
  const bits = base === 16 ? width * 4 : base === 8 ? width * 3 : width;
  let s = (n < 0 ? n + Math.pow(2, Math.min(bits, 32)) : n).toString(base).padStart(width, '0');
  if(/[A-F]/.test(m[2])) s = s.toUpperCase();
  if(parts.length > 1){   // same digit grouping as the export
    const size = parts[parts.length - 1].length;
    s = s.replace(new RegExp(`\\B(?=(.{${size}})+$)`, 'g'), '_');
  }
  return `${base}#${s}`;
}

// What a tag shows where there is room for a single value: tooltip line, right
// panel, tag list, rung card, player TAGS. A timer or counter is its DN bit, the
// way a PRN snapshot already stores it; a CONTROL element is POS/LEN. null = nothing
// known yet.
function tagValueText(addr, lv, prog, instType){
  const v = lv ? lv.value : undefined;
  if(v && typeof v === 'object' && !Array.isArray(v)) return lvText(v);
  const kind = lvStructKind(addr, prog, instType);
  if(kind === 'tc'){
    const dn = tagSubLV(addr, 'DN', prog);
    return dn ? (dn.value ? '1' : '0') : null;
  }
  if(kind === 'ctl'){
    const pos = tagSubLV(addr, 'POS', prog), len = tagSubLV(addr, 'LEN', prog);
    return (pos && len) ? `${pos.value}/${len.value}` : null;
  }
  return (v === undefined || v === null) ? null : lvText(v);
}

function showTT(h,cx,cy){
  const tt=document.getElementById('tt');
  if(!h||!h.hit){tt.style.display='none';return;}
  const hit=h.hit, inst=hit.inst;
  // Check cursor is inside the visual box of the cell, not just the hit-zone
  const _isBig = BIG_I.has(inst.t);
  const _boxW = Math.min(hit.w-6, _isBig?52:40)*cam.z;
  const _boxH = (_isBig?34:24)*cam.z;
  const _absX = h.scene.ox + hit.x, _absY = h.scene.oy + hit.y;
  const _sc = w2s(_absX + hit.w/2, _absY + hit.h/2);
  const _rect = canvas.getBoundingClientRect();
  const _bx = _sc.x + _rect.left - _boxW/2, _by = _sc.y + _rect.top - _boxH/2;
  if(cx < _bx || cx > _bx+_boxW || cy < _by || cy > _by+_boxH){
    tt.style.display='none'; return;
  }
  // Determine program scope from the rung this cell belongs to
  ttFill(inst, h.scene?.rung?.file ? h.scene.rung.file.split('/')[0] : null);
  ttPlace(cx, cy);
}

// Beside the cursor, moved back into the window when it would leave it.
function ttPlace(cx, cy){
  const tt = document.getElementById('tt');
  tt.style.display = 'block';
  const r = tt.getBoundingClientRect();
  let L = cx + 14, T = cy - 10;
  if(L + r.width  > window.innerWidth  - 8) L = cx - r.width - 10;
  if(T + r.height > window.innerHeight - 8) T = window.innerHeight - r.height - 8;
  tt.style.left = Math.max(4, L) + 'px';
  tt.style.top  = Math.max(4, T) + 'px';
}

// Fills the tooltip for one block. Whatever hovers a block comes through here, so
// a block reads the same on the ladder, on an HMI indicator and in the player.
function ttFill(inst, rungProg){
  const saved = currentRungProg;
  currentRungProg = rungProg || null;
  try { _ttFill(inst, rungProg); } finally { currentRungProg = saved; }
}
function _ttFill(inst, rungProg){
  const qualKey  = rungProg ? `${rungProg}.${inst.g}` : null;
  const info = (qualKey && P?.syms[qualKey]) || P?.syms[inst.g];
  const descEntry = getDesc(inst.g);

  // ── Resolve alias ──
  const aliasFor   = info?.aliasFor || '';           // e.g. "Local:1:I.Data.5"
  const aliasLabel = aliasFor ? `→ ${aliasFor}` : '';

  // Tag name line: show aliasFor beneath if present
  const isSubFile = /^U3:\d+$/.test(inst.g);
  const displayG = inst.origG || inst.g;
  const ttName = isSubFile ? `FILE ${inst.g.replace('U3:','')}` : displayG;
  document.getElementById('tt-n').textContent = ttName;
  document.getElementById('tt-s').textContent = aliasLabel || info?.sym || descEntry?.sym || '';

  // Type line
  const typeStr = P?.isL5X
    ? (info?.dataType ? `${inst.t} · ${info.dataType}${aliasFor ? ' · ALIAS' : ''}` : inst.t)
    : `${inst.t} · ${typeLabel(addrType(inst.g))}`;
  document.getElementById('tt-t').textContent = typeStr;

  // Description
  const desc = info?.desc || descEntry?.desc || '';
  document.getElementById('tt-d').textContent = desc;

  // Value — scope-aware: prefer qualified key, then bare, then aliasFor
  const lv = (qualKey && liveValues[qualKey]) || liveValues[inst.g] || (aliasFor && liveValues[aliasFor]) || null;
  const tv = document.getElementById('tt-v');
  if(inst.t.startsWith('AOI_')){
    // AOI: show EnableOut status instead of instance tag value
    const eo = liveValues[inst.g+'.EnableOut'];
    if(eo){
      tv.textContent = eo.value ? 'EnableOut = 1 (ON)' : 'EnableOut = 0 (OFF)';
      tv.style.color = eo.value ? 'var(--green)' : 'var(--red)';
    } else {
      tv.textContent = '';
    }
  } else if(FIFO_I.has(inst.t)){
    // The primary address is the CONTROL structure, whose scalar value is a
    // bit-packed status word — "= 4096" would be noise. Summarise the queue
    // instead; the operand rows below carry the detail.
    const _fp  = fifoParts(inst);
    const _len = fifoCtlNum(_fp.ctl,'LEN',_fp.lenOp);
    const _pos = fifoCtlNum(_fp.ctl,'POS',_fp.posOp);
    if(_pos === null || _len === null){
      tv.textContent = '';
    } else {
      tv.textContent = _pos === 0    ? `empty  (0 / ${_len})`
                     : _pos >= _len  ? `FULL  (${_pos} / ${_len})`
                     :                 `${_pos} queued  (${_pos} / ${_len})`;
      tv.style.color = _pos === 0 ? 'var(--text3)' : _pos >= _len ? '#e09020' : 'var(--blue)';
    }
  } else if(lv){
    // A timer or counter prints no value line: the rows below already carry DN,
    // PRE and ACC, and any single value would only repeat them. A read error shows.
    const vt = (lv.error || TT_TC_I.has(inst.t)) ? null : tagValueText(inst.g, lv, rungProg, inst.t);
    const dispVal = lv.error ? `ERR: ${lv.error}` : (vt === null ? '' : `= ${vt}`);
    // If value came from alias target, show that
    const fromAlias = !(qualKey && liveValues[qualKey]) && !liveValues[inst.g] && aliasFor && liveValues[aliasFor];
    tv.textContent = (fromAlias && dispVal) ? `${dispVal}  (via ${aliasFor})` : dispVal;
    tv.style.color = lv.error ? '#c07030'
      : vt === '1' ? 'var(--green)'
      : vt === '0' ? 'var(--red)'
      : 'var(--blue)';
    const tts = document.getElementById('tt-t');
    if(lv.prn)     tts.textContent = typeStr + ' · 📋 PRN';
    else if(lv.l5x) tts.textContent = typeStr + ' · 📄 L5X';
  } else {
    tv.textContent = '';
  }

  // ── Operand rows for multi-operand instructions ──
  const opsEl = document.getElementById('tt-ops');
  const BIG_TT = new Set(['MOV','ADD','SUB','MUL','DIV','MOD','CPT','AND','OR','XOR',
                           'EQU','GRT','LES','GEQ','LEQ','NEQ','LIM','MEQ',
                           'TON','TOF','RTO','CTU','CTD',
                           'COP','CPS','FLL','MSG','GSV','SSV',
                           'SCP','SCL','TOD','FRN','PID','IIM','IOM',
                           'SWPB','MVM','DTOS','SRT','TND','NEG','ABS','SQR','CLR','BTD','SIZE',
                           'FFL','FFU','LFL','LFU',
                           'CONCAT','DELETE','INSERT','MID','FIND','STOD','RTOS','STOR','LOWER','UPPER']);
  const ops = inst.operands || [];
  if(inst.t.startsWith('AOI_') && ops.length > 0){
    // ── AOI tooltip: show operands + all sub-member values ──
    let html = '';
    // Operand rows: AOI_Sequence, ControlData
    const aoiLbls = ['AOI_' + inst.t.slice(4), 'ControlData'];
    ops.forEach((op, i) => {
      const lbl = aoiLbls[i] || `Op ${i+1}`;
      const origOp = inst.origOperands ? inst.origOperands[i] : null;
      const dispOp = origOp || op;
      html += `<div class="tt-ops-row"><span class="tt-ops-lbl">${lbl}</span><span class="tt-ops-addr">${dispOp}</span></div>`;
    });
    // Sub-member values
    const base = inst.g;
    const skipSubs = new Set(['EnableIn','EnableOut']);
    for(const k in liveValues){
      if(!k.startsWith(base + '.')) continue;
      const sub = k.slice(base.length + 1);
      if(sub.includes('.') || skipSubs.has(sub)) continue;
      const sv = liveValues[k];
      const v = sv.value;
      const cls = v===1||v===true?'on': v===0||v===false?'off':'num';
      html += `<div class="tt-ops-row"><span class="tt-ops-lbl">${sub}</span><span class="tt-ops-val ${cls}">= ${lvText(v)}</span></div>`;
    }
    opsEl.innerHTML = html;
    opsEl.style.display = 'block';
  } else if(TT_TC_I.has(inst.t) || (BIG_TT.has(inst.t) && ops.length > 0)){
    // Label mapping by instruction type
    const lbls = (()=>{
      if(['MOV'].includes(inst.t))           return ['Source','Dest'];
      if(['ADD','SUB','MUL','DIV','MOD','AND','OR','XOR'].includes(inst.t)) return ['Src A','Src B','Dest'];
      if(['CPT'].includes(inst.t))           return ['Dest','Expression'];
      if(['EQU','GRT','LES','GEQ','LEQ','NEQ'].includes(inst.t)) return ['Src A','Src B'];
      if(['LIM'].includes(inst.t))           return ['Low Lim','Test','High Lim'];
      if(['MEQ'].includes(inst.t))           return ['Source','Mask','Compare'];
      if(TIMER_BASE_I.has(inst.t))           return ['Timer','Preset','Accum'];
      if(TT_TC_I.has(inst.t))                return ['Counter','Preset','Accum'];
      if(['COP','CPS','FLL'].includes(inst.t)) return ['Source','Dest','Length'];
      if(['SCP'].includes(inst.t))           return ['Input','Input Min','Input Max','Output Min','Output Max','Dest'];
      if(['SCL'].includes(inst.t))           return ['Source','Rate','Offset','Dest'];
      if(['TOD','FRN'].includes(inst.t))     return ['Source','Dest'];
      if(['PID'].includes(inst.t))           return ['Control','Process Var','Control Var'];
      if(['IIM','IOM'].includes(inst.t))     return ['Address','Mask','Slot'];
      if(['GSV'].includes(inst.t))           return ['Class','Instance','Attr','Dest'];
      if(['SSV'].includes(inst.t))           return ['Class','Instance','Attr','Source'];
      if(['SWPB'].includes(inst.t))          return ['Source','Order Mode','Dest'];
      if(['MVM'].includes(inst.t))           return ['Source','Mask','Dest'];
      if(['BTD'].includes(inst.t))           return ['Source','Source Bit','Dest','Dest Bit','Length'];
      if(['DTOS','STOD','RTOS','STOR','LOWER','UPPER'].includes(inst.t)) return ['Source','Dest'];
      if(['NEG','ABS','SQR','CLR','NOT'].includes(inst.t))  return ['Source','Dest'];
      if(['SRT'].includes(inst.t))           return ['Array','Dim to Vary','Control','Length','Position'];
      // Loaders take the data word first, unloaders take the stack first
      if(inst.t==='FFL')                     return ['Source','FIFO','Control','Length','Position'];
      if(inst.t==='LFL')                     return ['Source','LIFO','Control','Length','Position'];
      if(inst.t==='FFU')                     return ['FIFO','Dest','Control','Length','Position'];
      if(inst.t==='LFU')                     return ['LIFO','Dest','Control','Length','Position'];
      if(['SIZE'].includes(inst.t))          return ['Source','Dim to Vary','Size'];
      if(['CONCAT'].includes(inst.t))        return ['Source A','Source B','Dest'];
      if(['DELETE','MID'].includes(inst.t))  return ['Source','Qty','Start','Dest'];
      if(['INSERT'].includes(inst.t))        return ['Source A','Source B','Start','Dest'];
      if(['FIND'].includes(inst.t))          return ['Source','Search','Start','Result'];
      if(['TND'].includes(inst.t))           return [];
      return ops.map((_,i)=>`Op ${i+1}`);
    })();

    const isAddr = s => /^[A-Za-z]/.test(s);  // any identifier starting with letter = tag name
    const isLiteral = s => /^-?[\d.]+$/.test(s) || /^(16|2|8)#/.test(s); // numeric or radix literal

    // For Timer/Counter instructions the "Counter/Timer" op is a structure tag
    // and its scalar live value is a bit-packed status DINT (e.g. 536870912),
    // which is misleading. Preset/Accum are read from .PRE / .ACC sub-members,
    // not from extra positional operands — NeutralText often emits them as `?`.
    // Synthesize the three rows directly for these instructions.
    const isTimerCtr = TT_TC_I.has(inst.t);
    // FFL/FFU/LFL/LFU need their own rows: the Length and Position operands are
    // literals frozen into the rung text, while the values that matter live in
    // the CONTROL structure. The generic path would show the stale literals.
    const isFifo = FIFO_I.has(inst.t);
    let html = '';
    if(isFifo){
      const fp = fifoParts(inst);
      const ttRow = (lbl, addr, valHtml) =>
        `<div class="tt-ops-row"><span class="tt-ops-lbl">${lbl}</span>` +
        `<span class="tt-ops-addr">${addr}</span>${valHtml||''}</div>`;
      const ttVal = a => {
        const l = a ? resolveLV(a) : null;
        if(!l || l.error || l.value === undefined || l.value === null) return '';
        const v = l.value;
        const cls = (v===1||v===true) ? 'on' : (v===0||v===false) ? 'off' : 'num';
        return `<span class="tt-ops-val ${cls}">= ${lvText(v)}</span>`;
      };
      // Operand rows in RSLogix order. The stack keeps its '#' so it does not
      // read as a single word.
      if(fp.load) html += ttRow('Source', fp.src, ttVal(fp.src));
      // '#' is the RSLogix 500 file-pointer marker — Logix array operands
      // (Tag.Array[0]) are written plain and must not get one.
      const _sPfx = (P && P.isL5X) ? '' : '#';
      html += ttRow(fp.stackLbl, _sPfx+stripHash(fp.stack), '');
      if(!fp.load) html += ttRow('Dest', fp.dst, ttVal(fp.dst));
      html += ttRow('Control', fp.ctl || '—', '');
      const fLen = fifoCtlNum(fp.ctl,'LEN',fp.lenOp);
      const fPos = fifoCtlNum(fp.ctl,'POS',fp.posOp);
      html += ttRow('Length',   fp.ctl?`${fp.ctl}.LEN`:'—', fLen===null?'':`<span class="tt-ops-val num">= ${fLen}</span>`);
      html += ttRow('Position', fp.ctl?`${fp.ctl}.POS`:'—', fPos===null?'':`<span class="tt-ops-val num">= ${fPos}</span>`);
      // ── Queue contents, head on the left. Cells below POS hold live entries;
      //    the rest are stale leftovers the instruction will overwrite.
      const qAddrs = fifoStackAddrs(fp.stack, fLen);
      if(qAddrs.length){
        const cells = qAddrs.map((a,i)=>{
          const l = resolveLV(a);
          const known = l && !l.error && l.value !== undefined && l.value !== null;
          const filled = fPos !== null && i < fPos;
          const txt = known ? lvText(l.value) : '·';
          const style = filled
            ? 'background:#14304a;border-color:#4a9eff88;color:#9fd0ff'
            : 'background:#111a22;border-color:#2a3a48;color:#54646f';
          return `<span title="${a}${known?' = '+txt:''}" style="display:inline-block;min-width:15px;`+
                 `padding:0 3px;margin-right:2px;border:1px solid;border-radius:2px;`+
                 `text-align:center;${style}">${txt}</span>`;
        }).join('');
        const note = fPos === null ? 'position unknown'
                   : fPos === 0    ? 'empty'
                   : `${fPos} of ${fLen} queued · head = ${qAddrs[0]}`;
        html += `<div class="tt-ops-row" style="display:block">`+
                `<span class="tt-ops-lbl">Queue</span>`+
                `<div style="margin-top:3px;white-space:nowrap">${cells}</div>`+
                `<div style="color:var(--text3);font-size:9px;margin-top:2px">${note}</div>`+
                `</div>`;
      }
      // ── CONTROL status bits. The three this instruction actually drives are
      //    shown solid; the rest belong to other instruction families.
      const own = new Set([fp.enBit,'DN','EM']);
