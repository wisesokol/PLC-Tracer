      const bits = FIFO_BITS.map(b=>{
        const v = fifoCtlBit(fp.ctl, b);
        const c = v===null ? '#4a5a68' : v ? '#3ddc84' : (own.has(b) ? '#6a7a88' : '#3a4a58');
        const mark = v===null ? '?' : v ? '●' : '·';
        return `<span style="color:${c};margin-right:6px;${own.has(b)?'':'opacity:.5'}">${b}${mark}</span>`;
      }).join('');
      html += `<div class="tt-ops-row" style="display:block">`+
              `<span class="tt-ops-lbl">${fp.ctl||'Control'}</span>`+
              `<div style="margin-top:3px;font-size:9px">${bits}</div>`+
              `</div>`;
    } else if(isTimerCtr){
      const baseAddr = inst.g;
      const normBase = normalizeAddr(baseAddr);
      const bQual = rungProg ? `${rungProg}.${normBase}` : null;
      const bInfo = (bQual && P?.syms[bQual]) || P?.syms[normBase] || P?.syms[baseAddr];
      const bAlias = bInfo?.aliasFor || '';
      const readSub = sub => tagSubLV(normBase, sub, rungProg)
                          || (bAlias && tagSubLV(bAlias, sub, rungProg))
                          || null;
      const dn = readSub('DN');
      const dnHtml = dn ? `<span class="tt-ops-val ${dn.value?'on':'off'}">DN=${dn.value?1:0}</span>` : '';
      const aliasNote = bAlias ? `<span style="color:var(--text3);font-size:9px"> → ${bAlias}</span>` : '';
      html += `<div class="tt-ops-row">
        <span class="tt-ops-lbl">${lbls[0]}</span>
        <span class="tt-ops-addr">${baseAddr}${aliasNote}</span>
        ${dnHtml}
      </div>`;
      // Time base sits between Timer and Preset, as RSLogix 500 draws the block;
      // PRE/ACC then also say what they mean in seconds. Counters get neither.
      const tb = timerBase(inst.t, ops);
      if(tb) html += `<div class="tt-ops-row">
        <span class="tt-ops-lbl">Time Base</span>
        <span class="tt-ops-val lit">${tb.txt}</span>
        ${tb.note ? `<span style="color:var(--text3);font-size:9px">${tb.note}</span>` : ''}
      </div>`;
      const preLv = readSub('PRE');
      const accLv = readSub('ACC');
      const preVal = preLv ? `<span class="tt-ops-val num">= ${preLv.value}</span>${timerSecsNote(preLv, tb)}` : '';
      const accVal = accLv ? `<span class="tt-ops-val num">= ${accLv.value}</span>${timerSecsNote(accLv, tb)}` : '';
      html += `<div class="tt-ops-row">
        <span class="tt-ops-lbl">${lbls[1]}</span>
        <span class="tt-ops-addr">${baseAddr}.PRE</span>
        ${preVal}
      </div>`;
      html += `<div class="tt-ops-row">
        <span class="tt-ops-lbl">${lbls[2]}</span>
        <span class="tt-ops-addr">${baseAddr}.ACC</span>
        ${accVal}
      </div>`;
    } else {
    ops.forEach((op, i) => {
      const lbl = lbls[i] || `Op ${i+1}`;
      if(!isLiteral(op)){
        const normOp = normalizeAddr(op);
        const opQualKey = rungProg ? `${rungProg}.${normOp}` : null;
        const opInfo = (opQualKey && P?.syms[opQualKey]) || P?.syms[normOp] || P?.syms[op];
        const opLv = (opQualKey && liveValues[opQualKey]) || liveValues[normOp] || liveValues[op];
        // Resolve alias chain
        const opAlias = opInfo?.aliasFor || '';
        const opLvResolved = opLv || (opAlias && liveValues[opAlias]) || null;

        let valHtml = '';
        if(isBinaryWordAddr(normOp)){
          // Binary word address: show Bin + Dec. The word itself is one atomic read;
          // the bits may be only the few the ladder names, so they are the fallback.
          const wordV = (opLvResolved && !opLvResolved.error) ? opLvResolved.value : null;
          const assembled = Number.isInteger(wordV) ? (wordV & 0xFFFF) : assembleBinaryWord(normOp);
          if(assembled !== null){
            const binStr = toBin16(assembled);
            valHtml = `<span class="tt-ops-val num">Bin: ${binStr}</span>`;
            valHtml += `<span class="tt-ops-val num" style="margin-left:4px">(Dec: ${assembled})</span>`;
          } else {
            valHtml = `<span class="tt-ops-val" style="color:var(--text3)">= ?</span>`;
          }
        } else if(opInfo?.dimensions && !normOp.includes('[')){
          // Array tag without index — no scalar value (RSLogix shows ??)
          valHtml = `<span class="tt-ops-val" style="color:var(--text3)">??</span>`;
        } else if(opLvResolved && !opLvResolved.error){
          const v = opLvResolved.value;
          const cls = v===1||v===true?'on': v===0||v===false?'off':'num';
          // Show decimal value
          valHtml = `<span class="tt-ops-val ${cls}">= ${lvText(v)}</span>`;
          // Show raw format (binary/hex) if the original Radix differs
          const rawVal = opInfo?.rawValue ? radixText(opInfo.rawValue, v) : '';
          if(rawVal && rawVal !== String(v)){
            valHtml += `<span class="tt-ops-val" style="color:var(--text3);font-size:9px;margin-left:4px">(${rawVal})</span>`;
          }
        }
        // Show alias target if exists
        const aliasNote = opAlias ? `<span style="color:var(--text3);font-size:9px"> → ${opAlias}</span>` : '';
        html += `<div class="tt-ops-row">
          <span class="tt-ops-lbl">${lbl}</span>
          <span class="tt-ops-addr">${op}${aliasNote}</span>
          ${valHtml}
        </div>`;
      } else {
        // literal value — show decimal conversion for hex/bin/oct
        const litDec = parsePlcLiteral(op);
        const needsConv = litDec !== null && !/^-?[\d.]+$/.test(op); // non-decimal format
        const convHtml = needsConv ? `<span class="tt-ops-val num">= ${litDec}</span>` : '';
        html += `<div class="tt-ops-row">
          <span class="tt-ops-lbl">${lbl}</span>
          <span class="tt-ops-val lit">${op}</span>
          ${convHtml}
        </div>`;
      }
    });
    }
    opsEl.innerHTML = html;
    opsEl.style.display = 'block';
  } else {
    opsEl.innerHTML = '';
    opsEl.style.display = 'none';
  }

  // An empty line takes no room, whichever tooltip was on screen before this one
  ['tt-s','tt-t','tt-d','tt-v'].forEach(id => {
    const el = document.getElementById(id);
    el.style.display = el.textContent ? '' : 'none';
  });
}
// ── END TOOLTIP ──

// ═══════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════════
//  DRAW CELL
// ═══════════════════════════════════════════════════════
function drawCell(hit, sceneOx, sceneOy, isHov, isSel){
  const {inst,x,y,w,h} = hit;
  const absX = sceneOx+x, absY = sceneOy+y;
  const cx = absX+w/2, cy = absY+h/2;
  const z = cam.z;
  const qualKey = currentRungProg ? `${currentRungProg}.${inst.g}` : null;
  const lv = (qualKey&&liveValues[qualKey])||liveValues[inst.g];
  const hasLive = !!(liveValues&&Object.keys(liveValues).length);
  const isOut = inst.r==='out'||inst.r==='both';
  const isCoil = OUT_I.has(inst.t);
  const isBig = BIG_I.has(inst.t);
  const wireY = cy;
  const state = (hasLive&&lv)?(cellState(inst)||'null'):'null';
  const isOn=state==='on',isOff=state==='off',isTiming=state==='timing',isNum=state==='numeric',hasState=state!=='null';

  // Energised wire through cell
  const wCol=STATE_WIRE[state];
  const wireW=isOn?3*z:isOff?1.5*z:2.2*z;
  const ps=w2s(absX,wireY),pe=w2s(absX+w,wireY);
  ctx.strokeStyle=wCol;ctx.lineWidth=wireW;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ps.x,ps.y);ctx.lineTo(pe.x,pe.y);ctx.stroke();

  // Cell box
  const boxW=Math.min(w-6,isBig?52:40)*z,boxH=(isBig?34:24)*z;
  const sc=w2s(cx,cy);
  const bx=sc.x-boxW/2,by=sc.y-boxH/2;

  // Background
  const fillC=isSel?(isOn?'#103828':isOff?'#2a0e0e':'#0e2820'):isHov?(isOn?'#0d2818':isOff?'#200c0c':'#0e2030'):(STATE_FILL[state]||'#131d2a');
  ctx.fillStyle=fillC;rr(bx,by,boxW,boxH,3*z);ctx.fill();

  // Inner glow
  if(hasState&&STATE_INNER[state]){ctx.fillStyle=STATE_INNER[state];rr(bx+1*z,by+1*z,boxW-2*z,boxH-2*z,2*z);ctx.fill();}

  // Border
  const baseBordC=STATE_BORD[state]||iClr(inst.t)+'99';
  const bordC=isSel?(STATE_BORD[state]||'#26c0a0'):isHov?'#70c0c0':(state==='null'?iClr(inst.t)+'cc':baseBordC);
  const bordW=(isSel||isOn)?1.8*z:1*z;
  ctx.strokeStyle=bordC;ctx.lineWidth=bordW;ctx.setLineDash([]);
  rr(bx,by,boxW,boxH,3*z);ctx.stroke();

  // Outer glow
  if(isOn||isSel){
    ctx.save();ctx.shadowColor=isSel?'#26c0a0':'#3ddc84';ctx.shadowBlur=isSel?12*z:8*z;
    ctx.strokeStyle=isSel?'#26c0a066':'#3ddc8466';ctx.lineWidth=1.5*z;
    rr(bx,by,boxW,boxH,3*z);ctx.stroke();ctx.restore();
  }
  if(isTiming){ctx.save();ctx.shadowColor='#e09020';ctx.shadowBlur=6*z;ctx.strokeStyle='#e0902044';ctx.lineWidth=1.5*z;rr(bx,by,boxW,boxH,3*z);ctx.stroke();ctx.restore();}

  // Symbol inside box
  const instCol=hasState?(STATE_BORD[state]||iClr(inst.t)):iClr(inst.t);

  if(isCoil&&!isBig){
    const coilCol=isOn?'#3ddc84':isOff?'#803030':iClr(inst.t);
    const fSize=Math.max(7,boxH*0.55);
    ctx.font=`bold ${fSize}px Consolas`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=coilCol;
    const label=inst.t==='OTL'?'(L)':inst.t==='OTU'?'(U)':'( )';
    ctx.fillText(label,sc.x,sc.y);
    if(isOn){ctx.shadowColor='#3ddc84';ctx.shadowBlur=6*z;ctx.fillText(label,sc.x,sc.y);ctx.shadowBlur=0;}

  } else if(inst.t==='JSR'||inst.t==='JMP'||inst.t==='LBL'||inst.t==='RET'){
    const jsrCol=iClr(inst.t);const fSize=Math.max(6,boxH*0.38);
    ctx.font=`bold ${fSize}px Consolas`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=jsrCol;
    const jsrLabel=inst.t==='JSR'?'Jump_Sub':inst.t==='JMP'?'Jump':inst.t==='LBL'?'Label':'Return';
    ctx.fillText(jsrLabel,sc.x,sc.y);

  } else if(!isBig){
    const barH=boxH*.55,sep=5*z;
    const contCol=isOn?'#3ddc84':isOff?'#903030':iClr(inst.t);
    const contW=isOn?2.5*z:1.5*z;
    const isOns=inst.t==='ONS'||inst.t==='OSR'||inst.t==='OSF';
    const barCx=isOns?sc.x+sep*1.5:sc.x;
    if(inst.t==='XIO'){ctx.strokeStyle=isOn?'#c03030':isOff?'#903030':iClr(inst.t)+'88';ctx.lineWidth=1.2*z;ctx.beginPath();ctx.moveTo(barCx-sep*.8,sc.y-barH/2);ctx.lineTo(barCx+sep*.8,sc.y+barH/2);ctx.stroke();}
    ctx.strokeStyle=contCol;ctx.lineWidth=contW;
    ctx.beginPath();ctx.moveTo(barCx-sep,sc.y-barH/2);ctx.lineTo(barCx-sep,sc.y+barH/2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(barCx+sep,sc.y-barH/2);ctx.lineTo(barCx+sep,sc.y+barH/2);ctx.stroke();
    if(isOn){ctx.strokeStyle='#3ddc8488';ctx.lineWidth=1.5*z;ctx.setLineDash([2*z,2*z]);ctx.beginPath();ctx.moveTo(barCx-sep,sc.y);ctx.lineTo(barCx+sep,sc.y);ctx.stroke();ctx.setLineDash([]);}
    if(isOns&&z>0.28){const lbl=inst.t;const fSize=Math.max(5,Math.min(boxH*0.40,9*z));ctx.font=`bold ${fSize}px Consolas`;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=isOn?'#d08040dd':isOff?'#80402088':iClr(inst.t)+'cc';ctx.fillText(lbl,barCx-sep-1.5*z,sc.y);ctx.textAlign='center';}

  } else {
    const col=instCol;ctx.textAlign='center';ctx.textBaseline='middle';
    const COMPARE_I=new Set(['EQU','GRT','LES','GEQ','LEQ','NEQ','LIM','MEQ']);

    if(COMPARE_I.has(inst.t)&&inst.operands&&inst.operands.length>=2&&z>0.28){
      if(inst.t==='LIM'&&inst.operands.length>=3){
        const low=inst.operands[0],test=inst.operands[1],high=inst.operands[2];
        const lvLow=resolveLV(low),lvTest=resolveLV(test),lvHigh=resolveLV(high);
        const valLow=lvLow?lvLow.value:parsePlcLiteral(low),valTest=lvTest?lvTest.value:parsePlcLiteral(test),valHigh=lvHigh?lvHigh.value:parsePlcLiteral(high);
        const dLow=valLow!==null?String(valLow):'?',dTest=valTest!==null?String(valTest):'?',dHigh=valHigh!==null?String(valHigh):'?';
        ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=col;ctx.fillText('LIM',sc.x,sc.y-13*z);
        if(z>0.40){
          const valFs=Math.max(6,8*z),lblFs=Math.max(5,6*z);
          const testCol=isOn?'#3ddc84':isOff?'#e05050':'#90b0c0';
          ctx.font=`${lblFs}px Consolas`;ctx.fillStyle='#607080';ctx.fillText(dLow.slice(0,8),sc.x,sc.y-2*z);
          ctx.font=`bold ${valFs}px Consolas`;ctx.fillStyle=testCol;ctx.fillText(dTest.slice(0,8),sc.x,sc.y+5.5*z);
          ctx.font=`${lblFs}px Consolas`;ctx.fillStyle='#607080';ctx.fillText(dHigh.slice(0,8),sc.x,sc.y+12*z);
        }
      } else {
        const srcA=inst.operands[0],srcB=inst.operands[1];
        const lvA=resolveLV(srcA),lvB=resolveLV(srcB);
        const valA=lvA?lvA.value:parsePlcLiteral(srcA),valB=lvB?lvB.value:parsePlcLiteral(srcB);
        const dispA=valA!==null?String(valA):'?',dispB=valB!==null?String(valB):'?';
        ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=col;ctx.fillText(inst.t,sc.x,sc.y-10*z);
        if(z>0.40){
          let valFs=Math.max(6,9*z);const valCol=isOn?'#3ddc84':isOff?'#e05050':'#90b0c0';
          const opSym=inst.t==='EQU'?'=':inst.t==='NEQ'?'≠':inst.t==='GRT'?'>':inst.t==='LES'?'<':inst.t==='GEQ'?'≥':inst.t==='LEQ'?'≤':'?';
          const pad=3*z,cy2=sc.y+3*z;
          ctx.textBaseline='middle';
          ctx.textAlign='left';ctx.font=`bold ${valFs}px Consolas`;ctx.fillStyle=valCol;ctx.fillText(dispA.slice(0,8),bx+pad,cy2);
          ctx.textAlign='center';const opFs=Math.max(7,10*z);ctx.font=`bold ${opFs}px Consolas`;ctx.fillStyle='#a0b8c8';ctx.fillText(opSym,sc.x,cy2);
          ctx.textAlign='right';ctx.font=`bold ${valFs}px Consolas`;ctx.fillStyle='rgba(200,220,240,0.7)';ctx.fillText(dispB.slice(0,8),bx+boxW-pad,cy2);
          ctx.textAlign='center';ctx.textBaseline='middle';
        }
      }
    } else if(MATH_DEST_I.has(inst.t)&&inst.operands&&inst.operands.length>=2&&z>0.35){
      const srcOps=inst.operands.slice(0,-1);
      ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=col;ctx.fillText(inst.t,sc.x,sc.y-10*z);
      if(z>0.40){
        const srcVals=srcOps.map(op=>{const lit=parsePlcLiteral(op);if(lit!==null)return String(lit);const rv=resolveLV(op);if(rv&&rv.value!==undefined)return lvText(rv.value);return'?';});
        const valFs=Math.max(6,8*z),valCol='#90b0c0';
        if(srcOps.length===1){ctx.font=`bold ${valFs}px Consolas`;ctx.fillStyle=valCol;ctx.fillText(srcVals[0].slice(0,10),sc.x,sc.y+1*z);}
        else{const opSym=inst.t==='ADD'?'+':inst.t==='SUB'?'−':inst.t==='MUL'?'×':inst.t==='DIV'?'÷':inst.t==='MOD'?'%':',';ctx.font=`bold ${valFs}px Consolas`;ctx.fillStyle=valCol;ctx.fillText((srcVals[0].slice(0,6)+' '+opSym+' '+srcVals[1].slice(0,6)).slice(0,16),sc.x,sc.y+1*z);}
      }
      if(lv&&isNum&&z>0.45){ctx.font=`${Math.max(5,7*z)}px Consolas`;ctx.fillStyle='#4a9effcc';ctx.fillText('→'+lvText(lv.value).slice(0,8),sc.x,sc.y+12*z);}
    } else if((inst.t==='TON'||inst.t==='TOF'||inst.t==='RTO')&&z>0.4){
      ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=isTiming?'#e09020':col;ctx.fillText(inst.t,sc.x,sc.y-8*z);
      const _tPfx=currentRungProg?`${currentRungProg}.`:'';
      const acc=liveValues[_tPfx+inst.g+'.ACC']||liveValues[inst.g+'.ACC'];
      const pre=liveValues[_tPfx+inst.g+'.PRE']||liveValues[inst.g+'.PRE'];
      if(acc&&pre&&pre.value>0){
        const pct=Math.min(1,Math.max(0,acc.value/pre.value));
        const bw=boxW-8*z,bh=5*z,bpx=sc.x-bw/2,bpy=sc.y+2*z;
        ctx.fillStyle='#162030';ctx.fillRect(bpx,bpy,bw,bh);
        const barCol=isTiming?'#e09020':(pct>=1?'#3ddc84':'#4a9eff');
        ctx.fillStyle=barCol;ctx.fillRect(bpx,bpy,bw*pct,bh);
        ctx.strokeStyle='#2a4060';ctx.lineWidth=0.8*z;ctx.strokeRect(bpx,bpy,bw,bh);
        if(z>0.6){ctx.font=`${Math.max(5,7*z)}px Consolas`;ctx.fillStyle='rgba(200,220,230,0.8)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(`${acc.value}/${pre.value}`,sc.x,bpy+bh+1*z);}
      } else {ctx.font=`${Math.max(5,7*z)}px Consolas`;ctx.fillStyle=col+'88';ctx.fillText('EN·TT·DN',sc.x,sc.y+5*z);}
    } else if((inst.t==='CTU'||inst.t==='CTD')&&z>0.4){
      ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=isOn?'#4a9eff':col;ctx.fillText(inst.t,sc.x,sc.y-5*z);
      const _cPfx=currentRungProg?`${currentRungProg}.`:'';
      const acc=liveValues[_cPfx+inst.g+'.ACC']||liveValues[inst.g+'.ACC'];
      const pre=liveValues[_cPfx+inst.g+'.PRE']||liveValues[inst.g+'.PRE'];
      if(acc!==undefined){ctx.font=`bold ${Math.max(6,9*z)}px Consolas`;ctx.fillStyle=isOn?'#4a9eff':'#4a7ab0';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(acc.value),sc.x,sc.y+5*z);
        if(pre&&z>0.55){ctx.font=`${Math.max(4,6*z)}px Consolas`;ctx.fillStyle='#304050';ctx.fillText('/'+pre.value,sc.x,sc.y+13*z);}
      } else {ctx.font=`${Math.max(5,7*z)}px Consolas`;ctx.fillStyle=col+'88';ctx.fillText('CU·CD·DN',sc.x,sc.y+5*z);}
    } else {
      ctx.font=`bold ${Math.max(6,8*z)}px Consolas`;ctx.fillStyle=col;ctx.fillText(inst.t,sc.x,sc.y);
    }
  }

  // Labels below box
  if(z>0.28){
    const maxLabelW=(w-2)*z;const fs_addr=Math.max(5,8*z);
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=4*z;
    ctx.fillStyle=isSel?'#40e0c0':'#ffffff';
    let fullLabel=inst.g;
    if(inst.g&&inst.g.startsWith('__label:'))fullLabel=inst.g.slice(8);
    if((inst.t==='JSR'||inst.t==='JMP'||inst.t==='LBL')&&inst.fileNum)fullLabel=`${inst.fileNum}`;
    ctx.font=`bold ${fs_addr}px Consolas`;
    const fullW=ctx.measureText(fullLabel).width;
    if(fullW<=maxLabelW){ctx.fillText(fullLabel,sc.x,by+boxH+2*z);}
    else{
      const mid=Math.ceil(fullLabel.length/2);let splitAt=mid;
      for(let d=0;d<mid;d++){if(fullLabel[mid+d]==='_'||fullLabel[mid+d]==='.'){splitAt=mid+d+1;break;}if(mid-d-1>=0&&(fullLabel[mid-d-1]==='_'||fullLabel[mid-d-1]==='.')){splitAt=mid-d;break;}}
      const line1=fullLabel.slice(0,splitAt),line2=fullLabel.slice(splitAt);
      const lineH=fs_addr+1*z;ctx.fillText(line1,sc.x,by+boxH+2*z);ctx.fillText(line2,sc.x,by+boxH+2*z+lineH);
    }
    ctx.shadowBlur=0;

    // Live value badge
    if(lv&&isNum){
      const vs=lv.error?'ERR':lvText(lv.value).slice(0,8);
      const lvY=by+boxH+12*z;
      const pillW=ctx.measureText(vs).width+6*z;
      ctx.fillStyle=lv.error?'#3a1800':'#0a1e38';ctx.strokeStyle=lv.error?'#c07030':'#4a9eff';ctx.lineWidth=0.8*z;
      rr(sc.x-pillW/2,lvY,pillW,fs_addr+3*z,2*z);ctx.fill();ctx.stroke();
      ctx.fillStyle=lv.error?'#e09050':'#7ac8ff';ctx.font=`bold ${Math.max(5,7*z)}px Consolas`;ctx.fillText(vs,sc.x,lvY+1*z);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  BRANCH & RAIL WIRES
// ═══════════════════════════════════════════════════════
function getTreeXExtent(tree,ox,oy){
  if(!tree)return null;
  if(tree.type==='inst')return{minX:ox,maxX:ox+CW};
  if(tree.type==='seq'){let cx=ox,minX=Infinity,maxX=-Infinity;tree.children.forEach(c=>{const m=measureTree(c);const ext=getTreeXExtent(c,cx,oy);if(ext){minX=Math.min(minX,ext.minX);maxX=Math.max(maxX,ext.maxX);}cx+=m.w;});return minX<=maxX?{minX,maxX}:null;}
  if(tree.type==='par'){const ms=tree.children.map(c=>measureTree(c));let cy=oy,minX=Infinity,maxX=-Infinity;tree.children.forEach((c,i)=>{const ext=getTreeXExtent(c,ox,cy);if(ext){minX=Math.min(minX,ext.minX);maxX=Math.max(maxX,ext.maxX);}cy+=ms[i].h+BRANCH_GAP;});return minX<=maxX?{minX,maxX}:null;}
  return null;
}

function drawBranchWires(tree,ox,oy,sceneOx,sceneOy){
  if(!tree)return;
  if(tree.type==='par'&&tree.children.length>1){
    const ms=tree.children.map(c=>measureTree(c));const maxW=Math.max(...ms.map(m=>m.w),CW);
    let cy=oy;const centerYs=[];ms.forEach((m,i)=>{centerYs.push(cy+m.h/2);cy+=m.h+BRANCH_GAP;});
    const topY=sceneOy+centerYs[0],botY=sceneOy+centerYs[centerYs.length-1];
    const lx=sceneOx+ox,rx=sceneOx+ox+maxW;
    const tl=w2s(lx,topY),bl=w2s(lx,botY),tr=w2s(rx,topY),br=w2s(rx,botY);
    ctx.strokeStyle='#2a5070';ctx.lineWidth=2*cam.z;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(bl.x,bl.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.stroke();
    cy=oy;
    tree.children.forEach((c,i)=>{
      const bH=ms[i].h;const branchCenterY=cy+bH/2;const childExtent=getTreeXExtent(c,ox,cy);
      if(childExtent){
        const wireY=sceneOy+branchCenterY;
        if(childExtent.minX>ox){const p1=w2s(sceneOx+ox,wireY),p2=w2s(sceneOx+childExtent.minX,wireY);ctx.strokeStyle='#253e5a';ctx.lineWidth=2*cam.z;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
        if(childExtent.maxX<ox+maxW){const p1=w2s(sceneOx+childExtent.maxX,wireY),p2=w2s(sceneOx+ox+maxW,wireY);ctx.strokeStyle='#253e5a';ctx.lineWidth=2*cam.z;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
      }
      cy+=bH+BRANCH_GAP;
    });
    cy=oy;tree.children.forEach((c,i)=>{drawBranchWires(c,ox,cy,sceneOx,sceneOy);cy+=ms[i].h+BRANCH_GAP;});
  } else if(tree.type==='seq'){let cx=ox;tree.children.forEach(c=>{drawBranchWires(c,cx,oy,sceneOx,sceneOy);cx+=measureTree(c).w;});}
}

function drawRungRailWires(scene){
  const {tree,ox,oy,railL,railR,totalH,hits}=scene;
  if(!tree||!hits||!hits.length)return;
  const z=cam.z;
  const firstHitCY=oy+hits[0].y+hits[0].h/2;
  let minX=Infinity,maxX=-Infinity;
  hits.forEach(h=>{const lx=ox+h.x,rx=ox+h.x+h.w;if(lx<minX)minX=lx;if(rx>maxX)maxX=rx;});
  ctx.strokeStyle='#253e5a';ctx.lineWidth=2*z;ctx.setLineDash([]);
  const railLWorld=ox+railL;if(minX>railLWorld){const p1=w2s(railLWorld,firstHitCY),p2=w2s(minX,firstHitCY);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  const railRWorld=ox+railR;if(maxX<railRWorld){const p1=w2s(maxX,firstHitCY),p2=w2s(railRWorld,firstHitCY);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
}

// ═══════════════════════════════════════════════════════
//  INTER-RUNG WIRES (from graph edges)
// ═══════════════════════════════════════════════════════
function drawInterRungWires(){
  if(!graphData || !graphData.edges) return;
  const z = cam.z;
  const sceneMap = new Map();
  ladderScene.forEach(s => sceneMap.set(s.rungId, s));

  // Graph edges go: rung → inter-node (tag) ← rung
  // We need to find explicit-link edges and draw wires between the requesting rung
  // and the writer rung through the shared tag.

  // Collect explicit link edges: writer_rung → inter_tag, with requestingRungId
  const explicitEdges = graphData.edges.filter(e => e.explicitLink && e.requestingRungId && e.linkAddr);

  for(const edge of explicitEdges){
    const writerScene = sceneMap.get(edge.from);
    const readerScene = sceneMap.get(edge.requestingRungId);
    if(!writerScene || !readerScene) continue;

    const tag = edge.linkAddr;
    const clickedAddr = edge.clickedAddr || tag;

    // Find the instruction in the writer rung that writes/uses this tag
    let srcHit = null;
    writerScene.hits.forEach(h => {
      if(h.inst.g === tag || h.inst.g === clickedAddr){
        if(h.inst.r === 'out' || h.inst.r === 'both') srcHit = h;
      }
    });
    // Fallback: any hit with the tag
    if(!srcHit) writerScene.hits.forEach(h => {
      if(h.inst.g === tag || h.inst.g === clickedAddr) srcHit = h;
    });
    if(!srcHit) srcHit = writerScene.hits[writerScene.hits.length-1];

    // Find the instruction in the reader rung that reads this tag
    let dstHit = null;
    const readAddr = clickedAddr || tag;
    readerScene.hits.forEach(h => {
      if(h.inst.g === readAddr && h.inst.r === 'in') dstHit = h;
    });
    // Fallback: any hit with the tag
    if(!dstHit) readerScene.hits.forEach(h => {
      if(h.inst.g === readAddr) dstHit = h;
    });
    if(!dstHit) dstHit = readerScene.hits[0];
    if(!srcHit || !dstHit) continue;

    // Determine wire color from reader cell state
    currentRungProg = readerScene.rung && readerScene.rung.file ? readerScene.rung.file.split('/')[0] : null;
    const st = cellState(dstHit.inst);
    currentRungProg = null;
    const col = st === 'on' ? '#3ddc84' : st === 'off' ? '#c03030' : '#4a9eff';

    drawWireBetweenScenes(writerScene, srcHit, readerScene, dstHit, col, true, tag, z);
  }

  // Also draw non-explicit edges between rungs that share a tag (simple rung→rung edges)
  for(const edge of graphData.edges){
    if(edge.explicitLink) continue;
    const srcScene = sceneMap.get(edge.from);
    const dstScene = sceneMap.get(edge.to);
    if(!srcScene || !dstScene) continue;

    const tag = edge.linkAddr || '';
    if(!tag) continue;

    let srcHit = null, dstHit = null;
    srcScene.hits.forEach(h => {if(h.inst.g === tag && (h.inst.r === 'out' || h.inst.r === 'both')) srcHit = h;});
    dstScene.hits.forEach(h => {if(h.inst.g === tag && h.inst.r === 'in') dstHit = h;});
    if(!srcHit) srcHit = srcScene.hits[srcScene.hits.length-1];
    if(!dstHit) dstHit = dstScene.hits[0];
    if(!srcHit || !dstHit) continue;

    currentRungProg = dstScene.rung && dstScene.rung.file ? dstScene.rung.file.split('/')[0] : null;
    const st = cellState(dstHit.inst);
    currentRungProg = null;
    const col = st === 'on' ? '#3ddc84' : st === 'off' ? '#c03030' : '#4a9eff';
    drawWireBetweenScenes(srcScene, srcHit, dstScene, dstHit, col, true, tag, z);
  }
}

function drawWireBetweenScenes(srcScene, srcHit, dstScene, dstHit, baseCol, dashed, label, z){
  if(!srcHit || !dstHit) return;
  const sx=srcScene.ox+srcHit.x+srcHit.w/2, sy=srcScene.oy+srcHit.y+srcHit.h/2;
  const dx=dstScene.ox+dstHit.x+dstHit.w/2, dy=dstScene.oy+dstHit.y+dstHit.h/2;
  const srcBottom=srcScene.oy+srcScene.totalH+14, dstTop=dstScene.oy-14;
  const midY=(srcBottom+dstTop)/2;
  const A=w2s(sx,sy), M=w2s((sx+dx)/2,midY), D=w2s(dx,dy);
  const vertStretch=Math.abs(M.y-A.y)*0.6+10;
  const cp1={x:A.x,y:A.y+(M.y>A.y?vertStretch:-vertStretch)};
  const cp2={x:D.x,y:D.y+(M.y>D.y?vertStretch:-vertStretch)};

  const col=`rgba(${parseInt(baseCol.slice(1,3),16)},${parseInt(baseCol.slice(3,5),16)},${parseInt(baseCol.slice(5,7),16)},0.38)`;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.6*z;
  if(dashed)ctx.setLineDash([6*z,4*z]);else ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.bezierCurveTo(cp1.x,cp1.y,cp2.x,cp2.y,D.x,D.y);ctx.stroke();ctx.setLineDash([]);

  // Arrowhead
  const al=6*z;const tx=D.x-cp2.x,ty=D.y-cp2.y;const tlen=Math.sqrt(tx*tx+ty*ty)||1;
  const nx=tx/tlen,ny=ty/tlen;const perp=0.38;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(D.x,D.y);
  ctx.lineTo(D.x-al*(nx*Math.cos(perp)-ny*Math.sin(perp)),D.y-al*(ny*Math.cos(perp)+nx*Math.sin(perp)));
  ctx.lineTo(D.x-al*(nx*Math.cos(-perp)-ny*Math.sin(-perp)),D.y-al*(ny*Math.cos(-perp)+nx*Math.sin(-perp)));
  ctx.closePath();ctx.fill();

  // Label
  if(label&&z>0.38){
    const t=0.5,tt=0.5;
    const lx=tt*tt*tt*A.x+3*tt*tt*t*cp1.x+3*tt*t*t*cp2.x+t*t*t*D.x;
    const ly=tt*tt*tt*A.y+3*tt*tt*t*cp1.y+3*tt*t*t*cp2.y+t*t*t*D.y;
    const fs=Math.max(6,8*z);ctx.font=`${fs}px Consolas`;
    const tw=ctx.measureText(label).width+6*z;
    ctx.fillStyle='rgba(13,17,23,0.80)';ctx.fillRect(lx-tw/2,ly-fs-1*z,tw,fs+2*z);
    ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(label,lx,ly);
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  MAIN DRAW
// ═══════════════════════════════════════════════════════
function drawGraph(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);

  // Dot grid
  const st=40*cam.z;ctx.fillStyle='rgba(50,80,110,0.55)';
  const ox0=(cam.x%st+canvas.width/2)%st,oy0=(cam.y%st+canvas.height/2)%st;
  for(let x=ox0;x<canvas.width;x+=st)for(let y=oy0;y<canvas.height;y+=st){ctx.beginPath();ctx.arc(x,y,0.8,0,Math.PI*2);ctx.fill();}

  if(!ladderScene.length) return;
  const z=cam.z;

  // 1) Rails, headers, branch wires
  ladderScene.forEach(scene=>{
    const {rung,ox,oy,railL,railR,totalH,hits}=scene;
    if(z>0.22){
      const hdr=w2s(ox+(railL+railR)/2,oy-HDR_H*0.55);
      ctx.fillStyle='#4a90b8';ctx.font=`bold ${Math.max(7,10*z)}px Consolas`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`${rung.file}  #${rung.rungNum}`,hdr.x,hdr.y);
      if(rung.comment&&z>0.42){ctx.fillStyle='rgba(140,190,210,0.65)';ctx.font=`${Math.max(5,8*z)}px Bahnschrift`;ctx.fillText(rung.comment.slice(0,44),hdr.x,hdr.y+12*z);}
    }
    const rTop=w2s(ox+railL,oy-4),rBot=w2s(ox+railL,oy+totalH+4);
    ctx.strokeStyle='#2a5070';ctx.lineWidth=3.5*z;
    ctx.beginPath();ctx.moveTo(rTop.x,rTop.y);ctx.lineTo(rBot.x,rBot.y);ctx.stroke();
    const rrTop=w2s(ox+railR,oy-4),rrBot=w2s(ox+railR,oy+totalH+4);
    ctx.beginPath();ctx.moveTo(rrTop.x,rrTop.y);ctx.lineTo(rrBot.x,rrBot.y);ctx.stroke();
    drawBranchWires(scene.tree,railL,0,ox,oy);
    drawRungRailWires(scene);
  });

  // 2) Inter-rung wires
  drawInterRungWires();

  // 3) Cells
  ladderScene.forEach(scene=>{
    const {ox,oy,hits}=scene;
    currentRungProg=scene.rung&&scene.rung.file?scene.rung.file.split('/')[0]:null;
    hits.forEach(hit=>{
      const isHov=hovHit&&hovHit.hit&&hovHit.scene===scene&&hovHit.hit.inst.g===hit.inst.g&&hovHit.hit.x===hit.x;
      const isSel=selHit&&selHit.hit&&selHit.scene===scene&&selHit.hit.inst.g===hit.inst.g&&selHit.hit.x===hit.x;
      drawCell(hit,ox,oy,isHov,isSel);
    });
  });
  currentRungProg=null;
}

// ═══════════════════════════════════════════════════════
//  INTERACTION — Pan/Zoom/Hover/Click
// ═══════════════════════════════════════════════════════
function hitTest(sx, sy){
  const w = s2w(sx, sy);
  for(const scene of ladderScene){
    for(const hit of scene.hits){
      const ax = scene.ox + hit.x, ay = scene.oy + hit.y;
      if(w.x >= ax && w.x <= ax+hit.w && w.y >= ay && w.y <= ay+hit.h)
        return {scene, hit};
    }
  }
  return null;
}

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const oldZ = cam.z;
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  cam.z = Math.max(0.05, Math.min(10, cam.z * factor));
  cam.x = mx - canvas.width/2 - (mx - canvas.width/2 - cam.x) * (cam.z / oldZ);
  cam.y = my - canvas.height/2 - (my - canvas.height/2 - cam.y) * (cam.z / oldZ);
  drawGraph();
}, {passive:false});

canvas.addEventListener('mousedown', e=>{
  if(e.button !== 0) return; // left button only
  drag = {on:true, lx:e.clientX, ly:e.clientY, moved:false, t0:performance.now()};
});

canvas.addEventListener('mousemove', e=>{
  if(drag.on){
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    const dist = Math.abs(dx) + Math.abs(dy);
    if(!drag.moved){
      // Require 50ms hold + 4px movement to start drag
      if(dist < 4 || performance.now() - drag.t0 < 50) return;
      drag.moved = true;
    }
    cam.x += dx; cam.y += dy;
    drag.lx = e.clientX; drag.ly = e.clientY;
    showTT(null,0,0);
    drawGraph();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const prev = hovHit;
  hovHit = hitTest(mx, my);
  // Same as the tracer: a block shows its tooltip whether playback runs or not
  showTT(hovHit, e.clientX, e.clientY);
  if(prev !== hovHit) drawGraph();
});

canvas.addEventListener('mouseleave', ()=>{
  hovHit = null;
  document.getElementById('tt').style.display='none';
  drawGraph();
});

canvas.addEventListener('mouseup', e=>{
  if(!drag.moved){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    selHit = hitTest(mx, my);
    drawGraph();
  }
  drag.on = false;
});

// Right-click on canvas cell → "Add to Timeline" menu
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if(!allFrames.length) return;
  const rect = canvas.getBoundingClientRect();
  const h = hitTest(e.clientX - rect.left, e.clientY - rect.top);
  if(!h || !h.hit) return;
  const inst = h.hit.inst;
  if(!inst || !isBoolInst(inst.t)) return;
  if(tlChannels.length >= TL_MAX_CHAN) return;
  const tagName = inst.g;
  if(tlChannels.find(c => c.tagName === tagName)) return;
  showCtxAddMenu(tagName, e.clientX, e.clientY);
});

// Right-click on timeline segment → duration tooltip
document.getElementById('tl-bar').addEventListener('contextmenu', e => {
  const seg = e.target.closest('.tl-seg');
  if(!seg) return;
  e.preventDefault();
  e.stopPropagation();
  const ms = parseFloat(seg.dataset.dur);
  const state = seg.dataset.val === '1' ? 'ON' : 'OFF';
  const tag = seg.dataset.tag;
  const tlTt = document.getElementById('tl-tt');
  tlTt.textContent = tag + '  ' + state + '  ' + formatTime(ms);
  tlTt.style.display = '';
  tlTt.style.left = Math.min(e.clientX + 12, window.innerWidth - 220) + 'px';
  tlTt.style.top  = (e.clientY - 28) + 'px';
  function hide(){ tlTt.style.display = 'none'; seg.removeEventListener('mouseleave', hide); }
  seg.addEventListener('mouseleave', hide);
});

// ═══════════════════════════════════════════════════════
//  DRAG & DROP
// ═══════════════════════════════════════════════════════
document.addEventListener('dragover', e=>{e.preventDefault();e.stopPropagation();});
document.addEventListener('drop', e=>{
  e.preventDefault();e.stopPropagation();
  const file = e.dataTransfer.files[0];
  if(file && file.name.endsWith('.ndrec')) handleFile(file);
});

// ═══════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if(e.code === 'Space'){e.preventDefault();togglePlay();}
  if(e.code === 'ArrowLeft'){e.preventDefault();stepFrame(-1);}
  if(e.code === 'ArrowRight'){e.preventDefault();stepFrame(1);}
  if(e.code === 'Home'){e.preventDefault();seekToFrame(0);}
  if(e.code === 'End'){e.preventDefault();seekToFrame(allFrames.length-1);}
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('resize', resize);

// Keep the canvas drawing buffer in sync with its container's actual size.
// Adding timeline variable rows grows the bottom panel and shrinks #canvas-wrap
// (flex layout). Without this, canvas.width/height stay stale, so hit-testing
// and coordinate transforms become offset from where blocks are drawn.
if(window.ResizeObserver){
  const ro = new ResizeObserver(() => resize());
  ro.observe(document.getElementById('canvas-wrap'));
}

resize();
</script>
</body>
